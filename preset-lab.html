<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Лаборатория пресетов — STRUCHORD</title>
<style>
  :root {
    --bg: #eae7e0;
    --surface: #ffffff;
    --ink: #1e2f41;
    --text: #1e1e2f;
    --text-2: #4a4a5a;
    --text-3: #8e8e9e;
    --border: rgba(0, 0, 0, 0.15);
    --border-light: rgba(0, 0, 0, 0.08);
    --accent: #2c3e66;
    --tint: rgba(0, 0, 0, 0.06);
    --active: #eddea8;
    --danger: #aa5a44;
    --danger-bg: #fef1ea;
    --success: #2c6e2c;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 8px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    font: 15px/1.5 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-3); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--surface); border-radius: 16px; padding: 18px 20px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .01em; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-3); font-weight: 600; }
  input[type=text], select, textarea {
    font: inherit; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text);
  }
  input[type=text] { min-width: 170px; }
  textarea { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button {
    font: inherit; padding: 7px 16px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: transform .1s, background .15s, border-color .15s;
  }
  button:hover { transform: translateY(-1px); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  button.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  button.tab { border-radius: 14px; }
  button.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  /* ---- список пресетов ---- */
  .plist { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow-y: auto; }
  .pitem {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border: 1px solid transparent; border-radius: 10px; cursor: pointer; text-align: left;
    width: 100%; background: none;
  }
  .pitem:hover { background: var(--tint); }
  .pitem.sel { background: var(--active); border-color: var(--ink); }
  .pitem .nm { font-weight: 600; font-size: 13px; flex: 1; }
  .pitem .meta { font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .pitem.dirty .nm::after { content: ' •'; color: var(--danger); }

  /* ---- сетка шагов ---- */
  .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; }
  .beat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .beat-cells { display: flex; gap: 3px; }
  .beat-no { font-size: 10px; font-weight: 700; color: var(--text-3); }
  .step {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-size: 15px; font-weight: 700; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .step.filled { background: var(--active); border-color: var(--ink); color: var(--ink); }
  .step.mute { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .step.playing { box-shadow: 0 0 0 3px rgba(255,176,59,.75); }
  .step .pick-n { display: flex; flex-direction: column-reverse; gap: 0; font-size: 10px; line-height: 1.05; }
  .step .pick-n .bass { color: var(--accent); }

  /* ---- поповер струн ---- */
  .pop {
    position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.22); padding: 7px; display: flex; gap: 5px;
  }
  .pop button { width: 32px; height: 32px; border-radius: 50%; padding: 0; font-size: 13px; font-weight: 600; }
  .pop button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pop button.tok { color: var(--accent); border-color: var(--accent); border-style: dashed; }
  .pop button.tok.on { background: var(--accent); color: #fff; border-style: solid; }

  .hint { font-size: 11px; color: var(--text-3); }
  .warn { font-size: 12px; color: var(--danger); font-weight: 600; }
  .ok { font-size: 12px; color: var(--success); font-weight: 600; }
  .split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
  code.k { background: var(--tint); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--tint); color: var(--accent); }
  table.chk { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.chk td { padding: 3px 6px; border-bottom: 1px solid var(--border-light); }
  table.chk td:last-child { text-align: right; color: var(--text-3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Лаборатория пресетов</h1>
  <div class="sub">
    Звук, тайминг и вся ритмическая логика взяты напрямую из STRUCHORD.html —
    что слышно здесь, то и будет в приложении.
  </div>

  <div class="split">
    <!-- ЛЕВАЯ КОЛОНКА: список -->
    <div>

        <div class="row" style="margin-bottom:10px">

          <button class="tab" data-filter="strum">♩ Бой</button>
          <button class="tab" data-filter="pick">♪ Перебор</button>
        </div>
        <div class="plist" id="plist"></div>
        <div class="row" style="margin-top:12px">
          <button id="btn-new">+ Новый</button>
          <button id="btn-dup">Дублировать</button>
          <button id="btn-del" class="danger">Удалить</button>
        </div>
      </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: редактор -->
    <div>
      <div class="card">
        <h2>Редактор</h2>
        <div class="row">
          <label class="f">id (латиницей)
            <input type="text" id="f-id" placeholder="my-groove" />
          </label>
          <label class="f">Название
            <input type="text" id="f-name" placeholder="Мой бой" />
          </label>
        </div>
        <div class="row">
          <label class="f" style="flex:1;min-width:280px">Подсказка
            <input type="text" id="f-hint" style="width:100%" placeholder="Когда и для чего этот ритм" />
          </label>
        </div>
        <div class="row">
          <label class="f">Режим
            <select id="f-mode"><option value="strum">♩ Бой</option><option value="pick">♪ Перебор</option></select>
          </label>
          <label class="f">base — долей до повтора
            <select id="f-base"></select>
          </label>
          <label class="f">subdivision — нот на долю
            <select id="f-sub">
              <option value="1">1 — четверти</option>
              <option value="2">2 — восьмые</option>
              <option value="3">3 — триоли</option>
              <option value="4">4 — шестнадцатые</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card">
        <h2>Рисунок</h2>
        <div class="grid" id="grid"></div>
        <div class="hint" id="grid-hint"></div>
        <div class="row" style="margin-top:12px">
          <button id="btn-play" class="primary">▶ Слушать в цикле</button>
          <button id="btn-clear">Очистить</button>
          <label class="f">Аккорд
            <select id="f-chord"></select>
          </label>
          <label class="f">Темп
            <input type="text" id="f-bpm" value="100" style="min-width:70px" />
          </label>
          <label class="f">Проверить в размере
            <select id="f-ts">
              <option>4/4</option><option>3/4</option><option>2/4</option>
              <option>5/4</option><option>6/8</option><option>9/8</option><option>12/8</option>
            </select>
          </label>
        </div>
        <div id="report" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <h2>Код для STRUCHORD.html</h2>
        <div class="hint" style="margin-bottom:8px">
          Замените в файле массив <code class="k">const STRUM_PRESETS = [ … ];</code> на текст ниже.
        </div>
        <textarea id="out" rows="14" readonly></textarea>
        <div class="row" style="margin-top:10px">
          <button id="btn-copy" class="primary">Скопировать</button>
          <button id="btn-download">Скачать .js</button>
          <span class="hint" id="copy-note"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   ДВИЖОК, ИЗВЛЕЧЁННЫЙ ИЗ STRUCHORD.html (не редактировать вручную —
   пересобирается скриптом build-preset-lab.py)
   =================================================================== */
let audioCtx = null;
const activeOscillators = new Set();
let globalTimeSig = '4/4';

const STRING_OPEN_FREQ = [82.4069, 110.0, 146.8324, 195.9977, 246.9417, 329.6276];

const pluckBufferCache = new Map();

let guitarDryBus = null,
  guitarWetBus = null,
  guitarBodyConvolver = null,
  guitarMasterGain = null;

const PICK_BASS_TOKEN = 'B';

const PICK_ALT_BASS_TOKEN = 'A';

let ringingVoices = [];

const PLUCK_CACHE_LIMIT = 300;

const TUNER_TUNINGS = [
  // --- Частые: 95% уроков идут в одном из этих двух ---
  // Стоят ПЕРВЫМИ и вынесены из своих групп: иначе Drop D лежал бы
  // седьмым пунктом, за пятью строями, которые ученик увидит раз в год.
  { id: 'e-std', group: 'Частые', name: 'E Standard', notes: ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'] },
  { id: 'drop-d', group: 'Частые', name: 'Drop D', notes: ['D2', 'A2', 'D3', 'G3', 'B3', 'E4'] },

  // --- Стандартные: весь строй сдвинут целиком, по убыванию высоты ---
  { id: 'eb-std', group: 'Standard', name: 'Eb Standard', notes: ['D#2', 'G#2', 'C#3', 'F#3', 'A#3', 'D#4'] },
  { id: 'd-std', group: 'Standard', name: 'D Standard', notes: ['D2', 'G2', 'C3', 'F3', 'A3', 'D4'] },
  { id: 'csharp-std', group: 'Standard', name: 'C# Standard', notes: ['C#2', 'F#2', 'B2', 'E3', 'G#3', 'C#4'] },
  { id: 'c-std', group: 'Standard', name: 'C Standard', notes: ['C2', 'F2', 'A#2', 'D#3', 'G3', 'C4'] },
  { id: 'b-std', group: 'Standard', name: 'B Standard', notes: ['B1', 'E2', 'A2', 'D3', 'F#3', 'B3'] },

  // --- Drop: шестая струна опущена на тон относительно строя ---
  { id: 'drop-csharp', group: 'Drop', name: 'Drop C#', notes: ['C#2', 'G#2', 'C#3', 'F#3', 'A#3', 'D#4'] },
  { id: 'drop-c', group: 'Drop', name: 'Drop C', notes: ['C2', 'G2', 'C3', 'F3', 'A3', 'D4'] },
  { id: 'drop-b', group: 'Drop', name: 'Drop B', notes: ['B1', 'F#2', 'B2', 'E3', 'G#3', 'C#4'] },
  { id: 'drop-a#', group: 'Drop', name: 'Drop A#', notes: ['A#1', 'F2', 'A#2', 'D#3', 'G3', 'C4'] },
  { id: 'drop-a', group: 'Drop', name: 'Drop A', notes: ['A1', 'E2', 'A2', 'D3', 'F#3', 'B3'] },
  { id: 'drop-g', group: 'Drop', name: 'Drop G', notes: ['G1', 'D2', 'G2', 'C3', 'E3', 'A3'] },
  { id: 'double-drop-d', group: 'Drop', name: 'Double Drop D', notes: ['D2', 'A2', 'D3', 'G3', 'B3', 'D4'] },

  // --- Open: открытые струны дают аккорд ---
  { id: 'open-e', group: 'Open', name: 'Open E', notes: ['E2', 'B2', 'E3', 'G#3', 'B3', 'E4'] },
  { id: 'open-d', group: 'Open', name: 'Open D', notes: ['D2', 'A2', 'D3', 'F#3', 'A3', 'D4'] },
  { id: 'open-dm', group: 'Open', name: 'Open Dm', notes: ['D2', 'A2', 'D3', 'F3', 'A3', 'D4'] },
  { id: 'open-c', group: 'Open', name: 'Open C', notes: ['C2', 'G2', 'C3', 'G3', 'C4', 'E4'] },
  { id: 'open-g', group: 'Open', name: 'Open G', notes: ['D2', 'G2', 'D3', 'G3', 'B3', 'D4'] },
  { id: 'open-gm', group: 'Open', name: 'Open Gm', notes: ['D2', 'G2', 'D3', 'G3', 'A#3', 'D4'] },
  { id: 'open-a', group: 'Open', name: 'Open A', notes: ['E2', 'A2', 'E3', 'A3', 'C#4', 'E4'] },
  { id: 'open-am', group: 'Open', name: 'Open Am', notes: ['E2', 'A2', 'E3', 'A3', 'C4', 'E4'] },

  // --- Прочие: модальные и специальные ---
  { id: 'dadgad', group: 'Прочие', name: 'DADGAD', notes: ['D2', 'A2', 'D3', 'G3', 'A3', 'D4'] },
  { id: 'dadaad', group: 'Прочие', name: 'DADAAD', notes: ['D2', 'A2', 'D3', 'A3', 'A3', 'D4'] },
];

let tunerTuningId = 'e-std';

let tunerCustomNotes = null;

const STD_TUNING_NOTES = ['E2', 'A2', 'D3', 'G3', 'B3', 'E4'];

const CHROMATIC = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

const SHARP_TO_FLAT = {
  'C#': 'Db',
  'D#': 'Eb',
  'F#': 'Gb',
  'G#': 'Ab',
  'A#': 'Bb',
  B: 'Cb',
  'D#m': 'Ebm',
  'G#m': 'Abm',
  'A#m': 'Bbm',
};

const FLAT_TO_SHARP = {
  Db: 'C#',
  Eb: 'D#',
  Gb: 'F#',
  Ab: 'G#',
  Bb: 'A#',
  Cb: 'B',
  Ebm: 'D#m',
  Abm: 'G#m',
  Bbm: 'A#m',
};

// Синтетическая импульсная характеристика деки — короткий затухающий
// отфильтрованный шум. Подмешивается небольшой долей к сухому сигналу,
// чтобы дать звучанию немного объёма и "дерева" вместо стерильного
// сигнала прямо с осциллятора/буфера.
function buildGuitarBodyImpulse(ctx) {
  const duration = 0.35;
  const length = Math.floor(ctx.sampleRate * duration);
  const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const data = impulse.getChannelData(ch);
    let prev = 0;
    for (let i = 0; i < length; i++) {
      const t = i / length;
      const noise = Math.random() * 2 - 1;
      prev = prev * 0.6 + noise * 0.4;
      data[i] = prev * Math.pow(1 - t, 3);
    }
  }
  return impulse;
}

function ensureGuitarBus(ctx) {
  if (guitarMasterGain) return;
  guitarMasterGain = ctx.createGain();
  guitarMasterGain.gain.value = 1;
  guitarMasterGain.connect(ctx.destination);

  guitarDryBus = ctx.createGain();
  guitarDryBus.gain.value = 0.9;
  guitarDryBus.connect(guitarMasterGain);

  guitarWetBus = ctx.createGain();
  guitarWetBus.gain.value = 0.16;
  guitarBodyConvolver = ctx.createConvolver();
  try {
    guitarBodyConvolver.buffer = buildGuitarBodyImpulse(ctx);
  } catch (e) {}
  guitarBodyConvolver.connect(guitarWetBus);
  guitarWetBus.connect(guitarMasterGain);
}

// Собственно алгоритм Карплюса-Стронга: заполняем кольцевой буфер длиной
// sampleRate/freq шумом (щипок), затем многократно проходим по нему
// усредняющим фильтром с небольшим затуханием — это и даёт характерное
// "струнное" звучание с частотой, равной freq.
function synthesizePluck(ctx, freq, duration, brightness) {
  const sampleRate = ctx.sampleRate;
  const length = Math.max(8, Math.floor(sampleRate * duration));
  const buffer = ctx.createBuffer(1, length, sampleRate);
  const data = buffer.getChannelData(0);
  const N = Math.max(2, Math.round(sampleRate / freq));
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  // Сглаживаем исходное возбуждение струны: чем ярче струна (brightness
  // ближе к 1, тонкие струны), тем резче/жёстче атака щипка; басовые
  // струны получают более мягкое, "тёплое" возбуждение.
  const smoothing = 1 - brightness * 0.5;
  for (let i = 1; i < N; i++) {
    ring[i] = ring[i] * (1 - smoothing) + ring[i - 1] * smoothing;
  }
  let idx = 0;
  for (let i = 0; i < length; i++) {
    const cur = ring[idx];
    const nxt = ring[(idx + 1) % N];
    ring[idx] = (cur + nxt) * 0.5 * 0.996;
    data[i] = cur;
    idx = (idx + 1) % N;
  }
  return buffer;
}

function getPluckBuffer(ctx, freq, duration, brightness) {
  const key = Math.round(freq * 2) + '_' + Math.round(duration * 50) + '_' + Math.round(brightness * 100);
  const cached = pluckBufferCache.get(key);
  if (cached) {
    pluckBufferCache.delete(key);
    pluckBufferCache.set(key, cached); // освежаем позицию в LRU
    return cached;
  }
  const buf = synthesizePluck(ctx, freq, duration, brightness);
  if (pluckBufferCache.size >= PLUCK_CACHE_LIMIT) {
    const oldest = pluckBufferCache.keys().next().value;
    if (oldest !== undefined) pluckBufferCache.delete(oldest);
  }
  pluckBufferCache.set(key, buf);
  return buf;
}

// Проигрывает одну струну: буфер Карплюса-Стронга -> тембровый фильтр ->
// огибающая громкости (щипок + экспоненциальное затухание) -> панорама
// (низкие струны чуть левее, высокие чуть правее, как на реальном
// грифе) -> сухая шина + шина деки (конволюция).
function pluckString(ctx, opts) {
  const { freq, startTime, duration, gain, pan, brightness } = opts;
  if (!freq) return;
  ensureGuitarBus(ctx);

  const tail = duration + 0.4;
  const buf = getPluckBuffer(ctx, freq, tail, brightness);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  if (src.detune) src.detune.value = (Math.random() - 0.5) * 6; // живая микро-расстройка

  const toneFilter = ctx.createBiquadFilter();
  toneFilter.type = 'lowpass';
  toneFilter.frequency.value = 1000 + brightness * 3400;
  toneFilter.Q.value = 0.4;

  const attackEnd = startTime + 0.006;
  const floorGain = Math.max(gain * 0.001, 0.0006);
  const env = ctx.createGain();
  env.gain.setValueAtTime(0, startTime);
  env.gain.linearRampToValueAtTime(gain, attackEnd);
  env.gain.exponentialRampToValueAtTime(floorGain, startTime + duration);

  let outNode = env;
  if (ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.value = pan;
    env.connect(panner);
    outNode = panner;
  }

  src.connect(toneFilter);
  toneFilter.connect(env);
  outNode.connect(guitarDryBus);
  outNode.connect(guitarBodyConvolver);

  src.start(startTime);
  src.stop(startTime + tail);
  activeOscillators.add(src);
  src.onended = () => activeOscillators.delete(src);

  // Регистрируем голос в реестре звенящих струн — по нему потом сможем
  // резко приглушить звук, если встретится X (глушение ладонью).
  ringingVoices.push({
    env,
    src,
    startTime,
    attackEnd,
    peakGain: gain,
    floorGain,
    decayEnd: startTime + duration,
  });
  // Периодическая уборка отзвучавших голосов, чтобы массив не рос бесконечно.
  if (ringingVoices.length > 400) {
    ringingVoices = ringingVoices.filter((v) => v.decayEnd > startTime - 3);
  }
}

// Превращает аппликатуру (shape: 'x' | 0 | номер лада на каждой из 6
// струн) в реальные звучащие частоты по стандартному строю — именно
// это делает звук зависимым от выбранной аппликатуры, а не только от
// абстрактных тонов аккорда.
function shapeToPluckNotes(shape) {
  const notes = [];
  for (let s = 0; s < shape.length; s++) {
    const f = shape[s];
    if (f === 'x' || f === undefined || f === null) continue;
    const fret = typeof f === 'number' ? f : parseInt(f, 10);
    if (!Number.isFinite(fret)) continue;
    // Частоты открытых струн — из строя песни, а не из константы:
    // иначе на грифе нарисовано D, а звучит E.
    const base = songStringFreqs()[s];
    if (!base) continue;
    notes.push({ freq: base * Math.pow(2, fret / 12), stringIndex: s });
  }
  return notes;
}

// ---------- СИНТЕЗ: направленный бой, глушение, одиночный щипок ----------
// Строит и разыгрывает бой вниз/вверх по тем же нотам, что и strumChord, но
// с реверсом порядка струн и чуть иной динамикой для "вверх".
function strumChordDirectional(ctx, shape, chordName, key, startTime, duration, baseGain, direction) {
  ensureGuitarBus(ctx);
  let notes;
  if (shape) {
    notes = shapeToPluckNotes(shape);
  } else {
    const ks = getKeyStyle(key);
    const theoretical = getChordNotes(chordName, ks) || [];
    notes = theoretical
      .map((n) => noteToFrequency(n))
      .filter(Boolean)
      .map((freq, i) => ({ freq, stringIndex: 2 + (i % 4) }));
  }
  if (!notes.length) return;

  notes.sort((a, b) => (direction === 'up' ? b.stringIndex - a.stringIndex : a.stringIndex - b.stringIndex));

  const strumSpacing = direction === 'up' ? 0.01 : 0.014;
  notes.forEach((note, i) => {
    const stringIndex = note.stringIndex;
    const brightness = 0.45 + (stringIndex / 5) * 0.5;
    const pan = -0.28 + (stringIndex / 5) * 0.56;
    const levelJitter = 0.9 + Math.random() * 0.2;
    const directionGain = direction === 'up' ? 0.82 : 1; // апстрок традиционно чуть тише даунстрока
    const gain = baseGain * levelJitter * directionGain * (i === 0 ? 1.05 : 1);
    pluckString(ctx, {
      freq: note.freq,
      startTime: startTime + i * strumSpacing,
      duration,
      gain,
      pan,
      brightness,
    });
  });
}

// "Глушение" (X в бое) — перкуссионный шумовой "чанк" (правая ладонь глушит
// струны во время удара), а не приглушённая нота. Короткий отфильтрованный
// шумовой всплеск звучит гораздо ближе к реальному звуку, чем питчед-щипок.
function playMuteChunk(ctx, startTime, gain) {
  ensureGuitarBus(ctx);
  const duration = 0.09;
  const length = Math.max(1, Math.floor(ctx.sampleRate * duration));
  const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < length; i++) {
    const decay = Math.pow(1 - i / length, 2.2);
    data[i] = (Math.random() * 2 - 1) * decay;
  }
  const src = ctx.createBufferSource();
  src.buffer = buffer;
  const bandpass = ctx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 950;
  bandpass.Q.value = 0.8;
  const highpass = ctx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 180;
  const env = ctx.createGain();
  env.gain.setValueAtTime(Math.max(gain, 0.0001), startTime);
  env.gain.exponentialRampToValueAtTime(0.0005, startTime + duration);

  src.connect(highpass);
  highpass.connect(bandpass);
  bandpass.connect(env);
  env.connect(guitarDryBus);
  if (guitarBodyConvolver) env.connect(guitarBodyConvolver);

  src.start(startTime);
  src.stop(startTime + duration + 0.02);
  activeOscillators.add(src);
  src.onended = () => activeOscillators.delete(src);
}

function strumMute(ctx, shape, chordName, key, startTime, baseGain) {
  playMuteChunk(ctx, startTime, baseGain * 0.85);
}

// Щипок одной конкретной струны (для перебора). stringNumber — гитарная
// нумерация: 6 = толстая нижняя E, 1 = тонкая верхняя e (соответствует
// STRING_OPEN_FREQ/shape индексу stringIndex = 6 - stringNumber).
function pluckSingleGuitarString(ctx, shape, chordName, key, stringNumber, startTime, duration, baseGain) {
  ensureGuitarBus(ctx);
  const stringIndex = 6 - stringNumber;
  if (stringIndex < 0 || stringIndex > 5) return;
  // Открытые частоты — из строя песни (см. songStringFreqs).
  const openFreqs = songStringFreqs();
  let freq = null;
  if (shape && shape[stringIndex] !== undefined && shape[stringIndex] !== 'x' && shape[stringIndex] !== null) {
    const fret = typeof shape[stringIndex] === 'number' ? shape[stringIndex] : parseInt(shape[stringIndex], 10);
    if (Number.isFinite(fret)) freq = openFreqs[stringIndex] * Math.pow(2, fret / 12);
  }
  if (!freq) freq = openFreqs[stringIndex]; // струна заглушена/неизвестна — берём открытую как приближение
  const brightness = 0.45 + (stringIndex / 5) * 0.5;
  const pan = -0.28 + (stringIndex / 5) * 0.56;
  pluckString(ctx, { freq, startTime, duration, gain: baseGain, pan, brightness });
}

// Глушение ладонью (X): обрывает то, что СЕЙЧАС РЕАЛЬНО СЛЫШНО из
// звенящих струн — а не буквально все голоса, что когда-либо звучали в
// песне. Раньше функция принудительно поднимала громкость даже у почти
// неслышных, давно затухающих хвостов до одного и того же порога и тут
// же обрывала ИХ ВСЕ СИНХРОННО — на выходе это звучало не как глушение
// струн ладонью, а как синхронный провал громкости всего микса (эффект
// сайдчейн-компрессии в клубном треке). Плюс небольшой случайный разброс
// по времени и длительности среди задетых голосов — на настоящей гитаре
// ладонь касается разных струн не идеально одновременно.
function dampRingingVoicesAt(ctx, t, fadeTime = 0.035) {
  ringingVoices.forEach((voice) => {
    if (voice.decayEnd <= t || voice.startTime > t) return; // уже не звучит или ещё не началось
    const val = computeEnvValueAt(voice, t);
    // Голос и так уже практически неслышен (естественно затух) — трогать
    // не нужно, иначе именно принудительный "подъём" таких тихих хвостов
    // перед обрывом и создавал слышимый синхронный провал громкости.
    if (val < voice.peakGain * 0.03) return;
    const jitter = Math.random() * 0.02;
    const localFade = fadeTime * (0.85 + Math.random() * 0.3);
    const startAt = t + jitter;
    try {
      voice.env.gain.cancelScheduledValues(startAt);
      voice.env.gain.setValueAtTime(val, startAt);
      voice.env.gain.exponentialRampToValueAtTime(Math.max(val * 0.05, 0.0004), startAt + localFade);
    } catch (e) {}
    try {
      voice.src.stop(startAt + localFade + 0.02);
    } catch (e) {}
    voice.decayEnd = startAt + localFade;
  });
}

// Вычисляет громкость, которую в момент времени t уже имеет голос,
// затухающий по экспоненте от peakGain (в attackEnd) до floorGain (в
// decayEnd) — нужно, чтобы оборвать ноту не щелчком, а с той громкости,
// на которой она реально сейчас звучит.
function computeEnvValueAt(voice, t) {
  if (t <= voice.attackEnd) return voice.peakGain;
  if (t >= voice.decayEnd) return voice.floorGain;
  const ratio = (t - voice.attackEnd) / (voice.decayEnd - voice.attackEnd);
  return voice.peakGain * Math.pow(voice.floorGain / voice.peakGain, ratio);
}

// Ноты открытых струн текущего строя, от ШЕСТОЙ к первой, с октавами:
// ['D2','A2','D3','G3','B3','E4'].
function songTuningNotes() {
  return tunerActiveNotes();
}

// Частоты открытых струн для синтеза. Считаются из нот строя, а не
// берутся из константы: перестроенная струна обязана звучать так, как
// её слышно на живой гитаре.
function songStringFreqs() {
  return songTuningNotes().map((n) => noteToFrequency(n));
}

function tunerActiveNotes() {
  return tunerCustomNotes || tunerCurrentTuning().notes;
}

function tunerCurrentTuning() {
  return TUNER_TUNINGS.find((t) => t.id === tunerTuningId) || TUNER_TUNINGS[0];
}

function getKeyStyle(k) {
  const sMaj = ['C', 'G', 'D', 'A', 'E', 'B', 'F#'],
    sMin = ['Am', 'Em', 'Bm', 'F#m', 'C#m', 'G#m', 'D#m'];
  const fMaj = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb'],
    fMin = ['Dm', 'Gm', 'Cm', 'Fm', 'Bbm', 'Ebm'];
  if (sMaj.includes(k) || sMin.includes(k)) return 'sharp';
  if (fMaj.includes(k) || fMin.includes(k)) return 'flat';
  return 'sharp';
}

function noteToFrequency(note) {
  const notes = {
    C: 0,
    'C#': 1,
    Db: 1,
    D: 2,
    'D#': 3,
    Eb: 3,
    E: 4,
    F: 5,
    'F#': 6,
    Gb: 6,
    G: 7,
    'G#': 8,
    Ab: 8,
    A: 9,
    'A#': 10,
    Bb: 10,
    B: 11,
  };
  const m = note.match(/^([A-G][#b]?)(\d)?$/);
  if (!m) return null;
  const semitone = notes[m[1]],
    octave = m[2] ? parseInt(m[2]) : 4;
  return 440 * Math.pow(2, (semitone - 9) / 12 + (octave - 4));
}

function getChordNotes(cn, ks) {
  cn = normalizeChordCase(cn);
  const rm = cn.match(/^([A-G][#b]?)/);
  if (!rm) return [];
  const root = rm[1];
  let suffix = cn.slice(root.length).toLowerCase();
  const ri = CHROMATIC.indexOf(FLAT_TO_SHARP[root] || root);
  if (ri === -1) return [];
  let ints = [];

  const isDim = suffix.includes('dim') || suffix.includes('°'),
    isAug = suffix.includes('aug') || suffix.includes('+'),
    isSus = suffix.includes('sus'),
    // Минор — это ВЕДУЩАЯЯ 'm', не граничащая с 'maj'. Старая проверка
    // (includes('m') && !includes('maj')) ложно считала мажором
    // 'm(maj7)' и 'mmaj7' (из «mΔ»): C# вместо C в Am(maj7). Тот же
    // регекс уже стоит в автоопределении тональности. Суффикс 'dim'
    // тут бы тоже дал true, но dim-ветка ниже идёт раньше — безвредно.
    isMin = /^m(?!aj)/.test(suffix);

  // Обработка квинтаккорда (C5, C5add9...)
  if (/^5($|[^a-z])/.test(suffix)) {
    ints = [0, 7];
    suffix = suffix.replace(/^5/, '');
  } else if (isDim) {
    ints = [0, 3, 6];
  } else if (isAug) {
    ints = [0, 4, 8];
  } else if (isSus) {
    ints = suffix.includes('sus2') ? [0, 2, 7] : [0, 5, 7];
  } else if (isMin) {
    ints = [0, 3, 7];
  } else {
    ints = [0, 4, 7];
  }

  // Модификации b5/#5 (только если не чистый 5)
  if (!/^5/.test(cn.slice(root.length))) {
    if (suffix.includes('b5') || suffix.includes('-5')) ints = ints.map((i) => (i === 7 ? 6 : i));
    if (suffix.includes('#5') || suffix.includes('+5')) ints = ints.map((i) => (i === 7 ? 8 : i));
  }

  // Расширения (7, 9, 11, 13, 6...)
  //
  // Из суффикса СНАЧАЛА вырезаем add-хвосты: «add9» и «add11» добавляют
  // ОДНУ ноту и НЕ несут септимы. Без этого регулярка \d+ находила в
  // «Cadd9» цифру 9, ветка n >= 7 дописывала малую септиму — и аккорд
  // получал ноту A#, которой в нём нет. Следствие: Cadd9 переставал
  // считаться диатоническим, и ступень над ним не показывалась вовсе
  // (в тональности C он тоника, должен быть «I»).
  // Сами add-ноты добавляются ниже отдельными правилами.
  let extSuffix = suffix.replace(/add\d+/g, '');
  // '6/9' и слитное '69' — одно и то же: секста И нона. Не отдаём их
  // цифровому стеку ниже: тот читает только ПЕРВОЕ число, а parseInt
  // ('69') наставил бы ступени до тринадцатой.
  const has69 = /(^|\D)6\/?9(\D|$)/.test(extSuffix);
  if (has69) {
    extSuffix = extSuffix.replace(/6\/?9/, '');
    if (!ints.includes(9)) ints.push(9);
    if (!ints.includes(14)) ints.push(14);
  }
  const ext = extSuffix.match(/\d+/g);
  if (ext) {
    const n = parseInt(ext[0], 10);
    const hasMaj = extSuffix.includes('maj');
    const isDim7 = isDim && extSuffix.includes('7');
    if (n >= 7) {
      let seventh = 10;
      if (hasMaj || suffix.includes('maj7')) seventh = 11;
      else if (isDim7) seventh = 9;
      ints.push(seventh);
    }
    if (n >= 9) ints.push(14);
    if (n >= 11) ints.push(17);
    if (n >= 13) ints.push(21);
    if (n === 6) ints.push(9);
  }

  // Альтерации 9/11/13: цифровой стек выше читает только первое число,
  // поэтому b9/#9/#11/b13 до сих пор просто терялись — C7b9 звучал
  // ровно как C7. Кладём поверх базового аккорда; если записана и
  // натуральная ступень (C13b9), обе звучат — принятое приближение.
  if (/b9/.test(suffix)) ints.push(13);
  if (/#9/.test(suffix)) ints.push(15);
  if (/#11/.test(suffix)) ints.push(18);
  if (/b13/.test(suffix)) ints.push(20);

  if (suffix.includes('m7b5') || suffix.includes('ø')) ints = [0, 3, 6, 10];
  if (suffix.includes('add9') && !ints.includes(14)) ints.push(14);
  if (suffix.includes('add11') && !ints.includes(17)) ints.push(17);
  ints = [...new Set(ints)].sort((a, b) => a - b);

  return ints.map((i) => {
    let ni = (ri + i) % 12;
    let note = CHROMATIC[ni];
    if (ks === 'flat') note = SHARP_TO_FLAT[note] || note;
    return note + '4';
  });
}

function normalizeChordCase(ch) {
  if (!ch) return ch;
  let f = ch.replace(/\bBB\b/g, 'Bb');
  const p = f.split('/');
  const main = p[0],
    bass = p[1];
  const mm = main.match(/^([A-Ga-g][#b]?)(.*)$/);
  if (mm) {
    let root = mm[1].charAt(0).toUpperCase() + mm[1].slice(1).toLowerCase();
    let suffix = mm[2];
    // Джазовая конвенция: ЗАГЛАВНАЯ M — мажор (CM7 = Cmaj7, CM = C).
    // Слепой toLowerCase превращал её в минор: 'CM7' становился 'Cm7'.
    // Запись 'Maj' в любом регистре как работала нижним, так и работает.
    if (/^M\d/.test(suffix)) suffix = 'maj' + suffix.slice(1).toLowerCase();
    else if (suffix === 'M') suffix = '';
    else suffix = suffix.toLowerCase();
    f = root + suffix;
  }
  if (bass) {
    const bm = bass.match(/^([A-Ga-g][#b]?)/);
    if (bm) {
      let broot = bm[1].charAt(0).toUpperCase() + bm[1].slice(1).toLowerCase();
      f += '/' + broot;
    } else f += '/' + bass;
  }
  return f.replace(/BB/g, 'Bb');
}

// Длительность одной единицы записи (одной "span"-доли) в секундах при
// заданном темпе. Учитывает знаменатель размера: единица записи в X/8 вдвое
// короче единицы записи в X/4 при одинаковом BPM (BPM всегда в четвертях).
function getGridUnitDurationSeconds(bpm, ts) {
  const { denominator } = parseTimeSig(ts);
  const quarterNoteDuration = 60 / bpm;
  return quarterNoteDuration * (4 / denominator);
}

function parseTimeSig(ts) {
  const raw = ts || globalTimeSig || '4/4';
  const parts = String(raw).split('/');
  const numerator = parseInt(parts[0], 10);
  const denominator = parseInt(parts[1], 10);
  return {
    numerator: Number.isFinite(numerator) && numerator > 0 ? numerator : 4,
    denominator: Number.isFinite(denominator) && denominator > 0 ? denominator : 4,
  };
}

// Количество ячеек сетки (span-единиц) на один такт. Раньше это называлось
// beatsPerBar и вычислялось как parseInt(ts.split('/')[0]) — числитель.
// Поведение сохранено намеренно (см. комментарий выше), но теперь это
// именованная, документированная концепция, а не разрозненный inline-парсинг.
function getGridUnitsPerBar(ts) {
  return parseTimeSig(ts).numerator;
}

// Является ли размер составным (compound meter) — влияет на группировку
// долей и на то, что "четверть" не всегда доступна как subdivision.
function isCompoundMeter(ts) {
  const { numerator, denominator } = parseTimeSig(ts);
  return denominator === 8 && numerator >= 6 && numerator % 3 === 0;
}

// Нормализация шага перебора: возвращает массив «сущностей» — номеров
// струн 1..6 и/или басовых токенов. Токены СОХРАНЯЮТСЯ (в отличие от
// прежней версии, которая понимала только числа) — их разворачивает уже
// resolvePickStepStrings() перед самым звуком.
function normalizePickStep(symbol) {
  if (symbol === null || symbol === undefined || symbol === '') return [];
  const arr = Array.isArray(symbol) ? symbol : [symbol];
  const out = [];
  arr.forEach((v) => {
    if (isPickBassToken(v)) {
      if (!out.includes(v)) out.push(v);
      return;
    }
    const n = parseInt(v, 10);
    if (Number.isFinite(n) && n >= 1 && n <= 6 && !out.includes(n)) out.push(n);
  });
  return out;
}

function isPickBassToken(v) {
  return v === PICK_BASS_TOKEN || v === PICK_ALT_BASS_TOKEN;
}

// Для сортировки внутри шага: токены считаются «толще» любой струны,
// чтобы бас всегда рисовался сверху столбика (как самая низкая нота).
function pickStepSortValue(v) {
  if (v === PICK_BASS_TOKEN) return 7;
  if (v === PICK_ALT_BASS_TOKEN) return 6.5;
  return v;
}

// Подпись токена в интерфейсе — русская «Б», как и просили в UI.
function pickTokenLabel(v) {
  if (v === PICK_BASS_TOKEN) return 'Б';
  if (v === PICK_ALT_BASS_TOKEN) return 'Б₂';
  return String(v);
}

// Басовая струна аккорда: берём самую толстую НЕзаглушённую струну его
// реальной аппликатуры (то, что и щипнул бы гитарист), а если аппликатура
// неизвестна — определяем по основному тону (E/F/G → 6-я, A/B → 5-я,
// C/D → 4-я). Альтернирующий бас — соседняя басовая струна.
// Определяет басовую и альтернирующую струну по ГОТОВОЙ аппликатуре —
// самая толстая незаглушённая струна, то есть ровно та, которую взял бы
// гитарист. Если аппликатуры нет, откатываемся на таблицу по основному
// тону аккорда. Вызывается на каждом шаге воспроизведения, поэтому здесь
// нет ничего тяжёлого (shape уже посчитан выше по стеку).
function getBassStringsForShape(shape, chordName) {
  let bass = null;
  if (Array.isArray(shape)) {
    for (let idx = 0; idx < shape.length; idx++) {
      const v = shape[idx];
      if (v === 'x' || v === null || v === undefined) continue;
      const fret = typeof v === 'number' ? v : parseInt(v, 10);
      if (!Number.isFinite(fret)) continue;
      bass = 6 - idx;
      break;
    }
  }
  if (!bass) {
    const root = (String(chordName || '').trim().match(/^[A-Ha-h][#b]?/) || ['E'])[0].toUpperCase().replace('H', 'B');
    const byRoot = { E: 6, F: 6, 'F#': 6, Gb: 6, G: 6, 'G#': 6, Ab: 6, A: 5, 'A#': 5, Bb: 5, B: 5, C: 5, 'C#': 4, Db: 4, D: 4, 'D#': 4, Eb: 4 };
    bass = byRoot[root] || 6;
  }
  bass = Math.min(6, Math.max(3, bass));
  const alt = bass >= 5 ? 4 : bass === 4 ? 5 : 4;
  return { bass, alt };
}

// Разворачивает шаг в реальные номера струн для синтеза: токены 'B'/'A'
// заменяются басом текущего аккорда. Дубли убираются — иначе, если в шаге
// стоят и токен, и та же струна явно, щипок прозвучал бы дважды громче.
function resolvePickStepStrings(symbol, shape, chordName) {
  const items = normalizePickStep(symbol);
  if (!items.some(isPickBassToken)) return items;
  const { bass, alt } = getBassStringsForShape(shape, chordName);
  const nums = items.map((v) => (v === PICK_BASS_TOKEN ? bass : v === PICK_ALT_BASS_TOKEN ? alt : v));
  return Array.from(new Set(nums));
}

// Разворачивает пресет в настоящий паттерн под конкретную сетку:
// тиражирует его кусок до нужной длины и подставляет реальные басовые
// струны вместо токенов 'B' / 'A'.
// Разворачивает пресет в настоящий паттерн под конкретную сетку:
// тиражирует его кусок до нужной длины. Басовые токены 'B'/'A' здесь
// НАМЕРЕННО сохраняются как токены, а не подменяются номером струны —
// иначе перебор, заданный на всю секцию, застыл бы с басом первого
// аккорда. Реальную струну выбирает resolvePickStepStrings() уже во
// время воспроизведения, по аккорду каждой конкретной ячейки.
function buildPatternFromPreset(preset, gridUnits, chordName, key) {
  const sub = Math.max(1, preset.subdivision || 1);
  const unitLen = preset.base * sub;
  const total = Math.max(1, Math.round(gridUnits * sub));
  const steps = [];
  for (let i = 0; i < total; i++) {
    const raw = preset.steps[i % unitLen];
    if (preset.mode !== 'pick') {
      steps.push(raw ?? null);
      continue;
    }
    const items = normalizePickStep(raw);
    steps.push(items.length ? items.slice().sort((a, b) => pickStepSortValue(a) - pickStepSortValue(b)) : null);
  }
  return { mode: preset.mode, subdivision: sub, steps };
}

// Подходит ли пресет текущей сетке.
//
// Раньше здесь был ещё и ручной фильтр по полю `meter` ('simple' /
// 'compound' / 'any'), и он врал: пресет с meter:'simple' скрывался во
// ВСЕХ составных размерах, даже когда рисунок ложится в такт ровно.
// Скажем, «Шестёрка» с base:4 в 12/8 укладывается ×3 без остатка, но
// пользователь её не видел и не понимал почему — поле надо было
// вручную переставить в 'any'.
//
// Теперь тип размера ВЫЧИСЛЯЕТСЯ из самого рисунка, а не задаётся
// руками. Правил два, оба про реальную музыку:
//   1. Кусок должен укладываться в такт целое число раз — иначе рисунок
//      оборвётся на середине.
//   2. В составных размерах (6/8, 9/8, 12/8) доли группируются по три.
//      Рисунок длиной 1 долю подходит всегда; более длинный обязан быть
//      кратен трём (3, 6, 9…) либо сам делить группу нацело — иначе
//      акценты «поедут» относительно группировки.
// Поле `meter` в пресетах больше не используется; старые пресеты с ним
// продолжают работать — лишнее свойство просто игнорируется.
function isPresetCompatible(preset, ts, gridUnits) {
  const base = preset && preset.base;
  if (!gridUnits || !base || gridUnits % base !== 0) return false;
  if (!isCompoundMeter(ts)) return true;
  // Составной размер: рисунок в одну долю универсален, длинный —
  // должен уважать группировку по три.
  return base === 1 || base % 3 === 0;
}

// Ищет МИНИМАЛЬНЫЙ повторяющийся кусок паттерна: если весь ритм — это
// просто повторение одного и того же короткого куска (например, 12 шагов
// = 6 шагов, повторённых ×2), возвращает { unit: <этот кусок>, count: N }.
// Если повторов нет — { unit: все шаги как есть, count: 1 }. Символы
// сравниваются по содержимому (а не по ссылке) — важно для перебора, где
// шаг может быть массивом номеров струн.
function findRepeatUnit(steps) {
  const n = steps.length;
  if (n <= 1) return { unit: steps, count: 1 };
  // Шаг перебора может содержать не только числа, но и басовые токены
  // ('B'/'A') — сортируем через pickStepSortValue, иначе сравнение
  // числовым компаратором на строках даёт NaN и нестабильный порядок.
  const keyOf = (s) =>
    Array.isArray(s)
      ? 'p:' + s.slice().sort((a, b) => pickStepSortValue(a) - pickStepSortValue(b)).join(',')
      : String(s ?? '');
  const keys = steps.map(keyOf);
  for (let p = 1; p < n; p++) {
    if (n % p !== 0) continue;
    let ok = true;
    for (let i = p; i < n; i++) {
      if (keys[i] !== keys[i % p]) {
        ok = false;
        break;
      }
    }
    if (ok) return { unit: steps.slice(0, p), count: n / p };
  }
  return { unit: steps, count: 1 };
}

// Сравнивает два паттерна боя/перебора по содержимому (а не по ссылке) —
// нужно, чтобы понять, действительно ли ячейка играет ЧТО-ТО ДРУГОЕ, чем
// дефолт секции, или это один и тот же паттерн.
function patternsEqual(a, b) {
  if (!a && !b) return true;
  if (!a || !b) return false;
  if (a.mode !== b.mode) return false;
  if ((a.subdivision || 1) !== (b.subdivision || 1)) return false;
  const as = a.steps || [];
  const bs = b.steps || [];
  if (as.length !== bs.length) return false;
  for (let i = 0; i < as.length; i++) {
    const av = Array.isArray(as[i]) ? as[i].join(',') : String(as[i] ?? '');
    const bv = Array.isArray(bs[i]) ? bs[i].join(',') : String(bs[i] ?? '');
    if (av !== bv) return false;
  }
  return true;
}

// ---------- СМЕНА ДРОБНОСТИ БЕЗ ПОТЕРИ РИСУНКА ----------
// «Нот на долю» — это разрешение сетки, а не сам ритм. Поэтому при его
// смене рисунок должен сохраняться: шаг живёт не в «ячейке номер i», а в
// МОМЕНТЕ ВРЕМЕНИ i / subdivision (в долях от начала такта). Пересчёт и
// переносит каждый шаг в ту ячейку новой сетки, которая приходится на тот
// же момент:
//   sub 1: D D D D  →  sub 2: D _ D _ D _ D _  →  sub 4: D _ _ _ D _ _ _ …
// Огрубление сетки (4 → 1) обратимо не всегда: шаги, попавшие между новыми
// ячейками, деться некуда. Их количество возвращаем в lost, чтобы UI мог
// честно предупредить, а не молча стереть работу.
function resamplePatternSteps(steps, oldSub, newSub, totalNew) {
  const out = new Array(totalNew).fill(null);
  let lost = 0;
  const isFilled = (s) => (Array.isArray(s) ? s.length > 0 : s !== null && s !== undefined && s !== '');
  (steps || []).forEach((s, i) => {
    if (!isFilled(s)) return;
    // Момент шага в долях: i / oldSub. Его индекс в новой сетке.
    const pos = (i * newSub) / oldSub;
    const idx = Math.round(pos);
    if (Math.abs(pos - idx) > 1e-9 || idx >= totalNew) {
      lost++; // не попадает ровно в новую сетку — сохранить негде
      return;
    }
    out[idx] = Array.isArray(s) ? s.slice() : s;
  });
  return { steps: out, lost };
}

// ---------- РИТМЫ, УЖЕ ИСПОЛЬЗОВАННЫЕ В ЭТОЙ ПЕСНЕ ----------
// Библиотечные пресеты — это «вообще», а вот ритмы, которые автор уже
// поставил в этой песне, почти всегда важнее: припев обычно играется тем
// же боем, что и куплет. Поэтому собираем все паттерны из секций,
// квадратов и ячеек, схлопываем одинаковые (по содержимому, а не по
// ссылке) и показываем их в редакторе ПЕРЕД библиотекой.
//
// Длина у собранных паттернов разная (паттерн секции — такт, паттерн
// ячейки — её длительность), поэтому к чужой сетке они применяются по
// тому же принципу, что и пресеты: рисунок тиражируется, если укладывается
// целое число раз.
function getPatternUnits(pattern) {
  if (!pattern || !Array.isArray(pattern.steps)) return 0;
  return pattern.steps.length / Math.max(1, pattern.subdivision || 1);
}

function getAudioContext() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}

// Аппликатуры для прослушивания — берём типовые открытые формы; движку
// нужен только shape, полная библиотека аккордов здесь избыточна.
const DEMO_SHAPES = {
  Am: ['x', 0, 2, 2, 1, 0], E: [0, 2, 2, 1, 0, 0], D: ['x', 'x', 0, 2, 3, 2],
  C: ['x', 3, 2, 0, 1, 0], G: [3, 2, 0, 0, 0, 3], Em: [0, 2, 2, 0, 0, 0],
  F: [1, 3, 3, 2, 1, 1], A: ['x', 0, 2, 2, 2, 0], Dm: ['x', 'x', 0, 2, 3, 1],
};

let presets = JSON.parse(JSON.stringify(STRUM_PRESETS));
let selIdx = 0;
let filter = 'all';
let playing = false;
let playTimer = null;
let highlightTimers = [];

const $ = (id) => document.getElementById(id);

function cur() { return presets[selIdx]; }

// ---------- список ----------
function renderList() {
  const box = $('plist');
  box.innerHTML = '';
  presets.forEach((p, i) => {
    if (filter !== 'all' && p.mode !== filter) return;
    const b = document.createElement('button');
    b.className = 'pitem' + (i === selIdx ? ' sel' : '');
    b.onclick = () => { selIdx = i; stopPlay(); renderAll(); };
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = (p.mode === 'pick' ? '♪ ' : '♩ ') + (p.name || '(без имени)');
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${p.base}×${p.subdivision}`;
    b.append(nm, meta);
    box.appendChild(b);
  });
  $('cnt').textContent = presets.length + ' шт.';
}

// ---------- поля ----------
function renderFields() {
  const p = cur();
  if (!p) return;
  $('f-id').value = p.id || '';
  $('f-name').value = p.name || '';
  $('f-hint').value = p.hint || '';
  $('f-mode').value = p.mode;
  $('f-sub').value = String(p.subdivision);
  const baseSel = $('f-base');
  baseSel.innerHTML = '';
  for (let b = 1; b <= 12; b++) {
    const o = document.createElement('option');
    o.value = String(b);
    o.textContent = String(b);
    baseSel.appendChild(o);
  }
  baseSel.value = String(p.base);
}

// ---------- сетка ----------
function stepLabel(sym, mode) {
  if (mode === 'pick') {
    const items = normalizePickStep(sym);
    return items.length ? items.slice().sort((a, b) => pickStepSortValue(b) - pickStepSortValue(a)) : null;
  }
  return sym || null;
}

function renderGrid() {
  const p = cur();
  const g = $('grid');
  g.innerHTML = '';
  if (!p) return;
  const sub = p.subdivision;
  for (let beat = 0; beat < p.base; beat++) {
    const bd = document.createElement('div');
    bd.className = 'beat';
    const cells = document.createElement('div');
    cells.className = 'beat-cells';
    for (let s = 0; s < sub; s++) {
      const idx = beat * sub + s;
      const btn = document.createElement('button');
      btn.className = 'step';
      btn.dataset.i = String(idx);
      paintStep(btn, p.steps[idx], p.mode);
      // Маятник — как в приложении: нечётные ячейки начинают с ↓, чётные с ↑
      // Та же логика, что в приложении: при двоичном делении рука
      // чередуется по сквозному номеру, при триольном (sub 3) — вниз,
      // вниз, вверх внутри доли.
      const even = sub % 3 === 0 ? s % 3 === 2 : idx % 2 === 1;
      btn.title = even ? '↑ → ↓ → × → пусто' : '↓ → × → ↑ → пусто';
      btn.onclick = (e) => {
        e.stopPropagation();
        if (p.mode === 'pick') openPick(btn, idx);
        else {
          const cycle = even ? ['U', 'D', 'X', null] : ['D', 'X', 'U', null];
          const at = cycle.indexOf(p.steps[idx] ?? null);
          p.steps[idx] = cycle[(at + 1) % cycle.length];
          paintStep(btn, p.steps[idx], p.mode);
          onEdit();
        }
      };
      cells.appendChild(btn);
    }
    const no = document.createElement('span');
    no.className = 'beat-no';
    no.textContent = String(beat + 1);
    bd.append(cells, no);
    g.appendChild(bd);
  }
  $('grid-hint').textContent = p.mode === 'pick'
    ? 'Клик — выбрать струны. Б — бас аккорда (подставляется на лету), Б₂ — альтернирующий бас.'
    : 'Клик — цикл знаков. Порядок зависит от чётности ячейки (принцип маятника).';
}

function paintStep(btn, sym, mode) {
  btn.className = 'step';
  btn.innerHTML = '';
  const v = stepLabel(sym, mode);
  if (!v) return;
  btn.classList.add('filled');
  if (mode === 'pick') {
    const box = document.createElement('span');
    box.className = 'pick-n';
    v.forEach((n) => {
      const s = document.createElement('span');
      if (isPickBassToken(n)) s.className = 'bass';
      s.textContent = pickTokenLabel(n);
      box.appendChild(s);
    });
    btn.appendChild(box);
  } else {
    if (v === 'X') btn.classList.add('mute');
    btn.textContent = v === 'D' ? '↓' : v === 'U' ? '↑' : '×';
  }
}

function openPick(anchor, idx) {
  document.querySelectorAll('.pop').forEach((e) => e.remove());
  const p = cur();
  const pop = document.createElement('div');
  pop.className = 'pop';
  const cur1 = normalizePickStep(p.steps[idx]);
  const opts = [
    { v: PICK_BASS_TOKEN, tok: true }, { v: PICK_ALT_BASS_TOKEN, tok: true },
    { v: 6 }, { v: 5 }, { v: 4 }, { v: 3 }, { v: 2 }, { v: 1 },
  ];
  opts.forEach((o) => {
    const b = document.createElement('button');
    b.textContent = pickTokenLabel(o.v);
    b.className = (o.tok ? 'tok ' : '') + (cur1.includes(o.v) ? 'on' : '');
    b.onclick = (e) => {
      e.stopPropagation();
      const at = cur1.indexOf(o.v);
      if (at >= 0) cur1.splice(at, 1); else cur1.push(o.v);
      p.steps[idx] = cur1.length ? cur1.slice().sort((a, c) => pickStepSortValue(a) - pickStepSortValue(c)) : null;
      b.classList.toggle('on');
      paintStep(anchor, p.steps[idx], p.mode);
      onEdit();
    };
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const wdt = opts.length * 37;
  pop.style.left = Math.max(8, Math.min(r.left + r.width / 2 - wdt / 2, innerWidth - wdt - 8)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
  setTimeout(() => document.addEventListener('click', function off(e) {
    if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener('click', off, true); }
  }, true), 0);
}

// ---------- проверка ----------
function renderReport() {
  const p = cur();
  const box = $('report');
  box.innerHTML = '';
  if (!p) return;
  const problems = [];
  const need = p.base * p.subdivision;
  if (p.steps.length !== need) problems.push(`длина steps = ${p.steps.length}, а base×subdivision = ${need}`);
  if (!/^[a-z0-9-]+$/.test(p.id || '')) problems.push('id должен быть латиницей, цифрами и дефисами');
  const dup = presets.filter((x) => x.id === p.id).length;
  if (dup > 1) problems.push(`id «${p.id}» уже занят другим пресетом`);
  if (!p.steps.some((s) => (Array.isArray(s) ? s.length : s))) problems.push('нет ни одного удара');

  const t = document.createElement('table');
  t.className = 'chk';
  const ts = $('f-ts').value;
  const gridUnits = getGridUnitsPerBar(ts);
  const fits = isPresetCompatible(p, ts, gridUnits);
  const rows = [];
  if (fits) {
    const built = buildPatternFromPreset(p, gridUnits, $('f-chord').value, 'C');
    const hits = built.steps.filter((s) => (Array.isArray(s) ? s.length : s)).length;
    const { denominator } = parseTimeSig(ts);
    const noteNames = { 1: 'целые', 2: 'половинные', 3: 'триольные', 4: 'четверти', 6: 'секстоли', 8: 'восьмые', 12: 'триоли восьмых', 16: 'шестнадцатые' };
    rows.push(['В размере ' + ts, `помещается ×${gridUnits / p.base}`]);
    rows.push(['Ударов за такт', String(hits)]);
    rows.push(['Длительность нот', noteNames[denominator * p.subdivision] || ('1/' + denominator * p.subdivision)]);
    if (p.mode === 'pick') {
      const shape = DEMO_SHAPES[$('f-chord').value];
      const played = built.steps.map((s) => (s ? resolvePickStepStrings(s, shape, $('f-chord').value).join('+') : '·')).join(' ');
      rows.push(['Струны на ' + $('f-chord').value, played]);
    }
  } else {
    // Объясняем ПРИЧИНУ, а не просто «скрыт»: пользователь должен
    // понимать, дело в делимости или в группировке составного размера.
    const reason = gridUnits % p.base !== 0
      ? `${gridUnits} долей не делится на base=${p.base} — рисунок оборвётся`
      : `составной размер группируется по 3, а base=${p.base} этого не уважает`;
    rows.push(['В размере ' + ts, 'скрыт: ' + reason]);
  }
  rows.forEach(([a, b]) => {
    const tr = t.insertRow();
    tr.insertCell().textContent = a;
    tr.insertCell().textContent = b;
  });
  box.appendChild(t);
  const st = document.createElement('div');
  st.style.marginTop = '8px';
  if (problems.length) {
    st.className = 'warn';
    st.textContent = '⚠ ' + problems.join('; ');
  } else {
    st.className = 'ok';
    st.textContent = '✓ пресет корректен';
  }
  box.appendChild(st);
}

// ---------- воспроизведение ----------
function stopPlay() {
  playing = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  highlightTimers.forEach(clearTimeout);
  highlightTimers = [];
  document.querySelectorAll('.step.playing').forEach((e) => e.classList.remove('playing'));
  $('btn-play').textContent = '▶ Слушать в цикле';
}

function startPlay() {
  const ctx = getAudioContext();
  if (!ctx) return alert('Web Audio недоступен');
  if (ctx.state === 'suspended') ctx.resume();
  const p = cur();
  if (!p.steps.some((s) => (Array.isArray(s) ? s.length : s))) return;
  playing = true;
  $('btn-play').textContent = '■ Стоп';

  const chord = $('f-chord').value;
  const shape = DEMO_SHAPES[chord];
  const bpm = Math.max(30, Math.min(300, parseInt($('f-bpm').value, 10) || 100));
  const ts = $('f-ts').value;
  const stepSec = getGridUnitDurationSeconds(bpm, ts) / p.subdivision;

  const loop = () => {
    if (!playing) return;
    const t0 = ctx.currentTime + 0.06;
    p.steps.forEach((sym, i) => {
      const t = t0 + i * stepSec;
      if (p.mode === 'pick') {
        resolvePickStepStrings(sym, shape, chord).forEach((n) => {
          pluckSingleGuitarString(ctx, shape, chord, 'C', n, t, 1.7, 0.42);
        });
      } else if (sym === 'X') {
        strumMute(ctx, shape, chord, 'C', t, 0.4);
      } else if (sym === 'D' || sym === 'U') {
        strumChordDirectional(ctx, shape, chord, 'C', t, 1.4, 0.34, sym === 'U' ? 'up' : 'down');
      }
      // подсветка текущего шага
      const el = document.querySelector(`.step[data-i="${i}"]`);
      if (el) {
        const on = setTimeout(() => {
          el.classList.add('playing');
          const off = setTimeout(() => el.classList.remove('playing'), Math.max(70, stepSec * 700));
          highlightTimers.push(off);
        }, Math.max(0, (t - ctx.currentTime) * 1000));
        highlightTimers.push(on);
      }
    });
    playTimer = setTimeout(loop, Math.max(150, p.steps.length * stepSec * 1000));
  };
  loop();
}

// ---------- генерация кода ----------
function esc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function stepsToCode(p) {
  return '[' + p.steps.map((s) => {
    if (s === null || s === undefined) return 'null';
    if (Array.isArray(s)) return '[' + s.map((x) => (typeof x === 'string' ? `'${x}'` : x)).join(', ') + ']';
    return `'${s}'`;
  }).join(', ') + ']';
}

function renderCode() {
  const lines = ['const STRUM_PRESETS = ['];
  presets.forEach((p) => {
    lines.push('  {');
    lines.push(`    id: '${esc(p.id)}',`);
    lines.push(`    name: '${esc(p.name)}',`);
    lines.push(`    hint: '${esc(p.hint)}',`);
    lines.push(`    mode: '${p.mode}',`);
    lines.push(`    base: ${p.base},`);
    lines.push(`    subdivision: ${p.subdivision},`);
    lines.push(`    steps: ${stepsToCode(p)},`);
    lines.push('  },');
  });
  lines.push('];');
  $('out').value = lines.join('\n');
}

function onEdit() { renderReport(); renderCode(); }

function renderAll() { renderList(); renderFields(); renderGrid(); renderReport(); renderCode(); }

// ---------- события ----------
document.querySelectorAll('[data-filter]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('[data-filter]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.filter;
    renderList();
  };
});

['f-id', 'f-name', 'f-hint'].forEach((id) => {
  $(id).oninput = () => {
    const p = cur();
    p[id.slice(2)] = $(id).value;
    renderList();
    onEdit();
  };
});

$('f-mode').onchange = () => {
  const p = cur();
  p.mode = $('f-mode').value;
  p.steps = p.steps.map(() => null); // семантика ячеек разная
  stopPlay(); renderAll();
};

$('f-base').onchange = () => {
  const p = cur();
  const nb = parseInt($('f-base').value, 10);
  const old = p.steps.slice();
  p.base = nb;
  const need = nb * p.subdivision;
  // Удлиняем повтором рисунка, укорачиваем — обрезаем: так правка base
  // не стирает уже набранное.
  p.steps = Array.from({ length: need }, (_, i) => (old.length ? old[i % old.length] ?? null : null));
  stopPlay(); renderGrid(); onEdit();
};

$('f-sub').onchange = () => {
  const p = cur();
  const ns = parseInt($('f-sub').value, 10);
  // Тот же пересчёт по времени, что и в приложении.
  const r = resamplePatternSteps(p.steps, p.subdivision, ns, p.base * ns);
  p.subdivision = ns;
  p.steps = r.steps;
  stopPlay(); renderGrid(); onEdit();
  if (r.lost) $('grid-hint').textContent = `⚠ ${r.lost} удар(ов) не поместились в новую сетку`;
};

$('f-ts').onchange = onEdit;
$('f-chord').onchange = onEdit;
$('f-bpm').oninput = () => { if (playing) { stopPlay(); startPlay(); } };

$('btn-play').onclick = () => (playing ? stopPlay() : startPlay());
$('btn-clear').onclick = () => { cur().steps = cur().steps.map(() => null); renderGrid(); onEdit(); };

$('btn-new').onclick = () => {
  presets.push({
    id: 'new-' + Date.now().toString(36).slice(-4), name: 'Новый ритм', hint: '',
    mode: 'strum', base: 4, subdivision: 2,
    steps: new Array(8).fill(null),
  });
  selIdx = presets.length - 1;
  stopPlay(); renderAll();
};
$('btn-dup').onclick = () => {
  const c = JSON.parse(JSON.stringify(cur()));
  c.id = c.id + '-copy';
  c.name = c.name + ' (копия)';
  presets.splice(selIdx + 1, 0, c);
  selIdx++;
  stopPlay(); renderAll();
};
$('btn-del').onclick = () => {
  if (presets.length <= 1) return;
  if (!confirm(`Удалить пресет «${cur().name}»?`)) return;
  presets.splice(selIdx, 1);
  selIdx = Math.max(0, selIdx - 1);
  stopPlay(); renderAll();
};

$('btn-copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('out').value);
    $('copy-note').textContent = 'скопировано ✓';
  } catch (e) {
    $('out').select();
    $('copy-note').textContent = 'выделено — нажмите Ctrl+C';
  }
  setTimeout(() => ($('copy-note').textContent = ''), 2500);
};
$('btn-download').onclick = () => {
  const blob = new Blob([$('out').value], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'strum-presets.js';
  a.click();
  URL.revokeObjectURL(a.href);
};

// аккорды для прослушивания
Object.keys(DEMO_SHAPES).forEach((c) => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  $('f-chord').appendChild(o);
});
$('f-chord').value = 'Am';

renderAll();
</script>
</body>
