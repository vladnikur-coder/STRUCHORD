<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Лаборатория пресетов — STRUCHORD</title>
<style>
  :root {
    --bg: #eae7e0;
    --surface: #ffffff;
    --ink: #1e2f41;
    --text: #1e1e2f;
    --text-2: #4a4a5a;
    --text-3: #8e8e9e;
    --border: rgba(0, 0, 0, 0.15);
    --border-light: rgba(0, 0, 0, 0.08);
    --accent: #2c3e66;
    --tint: rgba(0, 0, 0, 0.06);
    --active: #eddea8;
    --danger: #aa5a44;
    --danger-bg: #fef1ea;
    --success: #2c6e2c;
    --radius: 10px;
    --shadow: 0 1px 2px rgba(0,0,0,.03), 0 4px 8px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 20px 60px;
    font: 15px/1.5 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--text-3); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--surface); border-radius: 16px; padding: 18px 20px;
    box-shadow: var(--shadow); margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: .01em; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 11px; color: var(--text-3); font-weight: 600; }
  input[type=text], select, textarea {
    font: inherit; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); color: var(--text);
  }
  input[type=text] { min-width: 170px; }
  textarea { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  button {
    font: inherit; padding: 7px 16px; border-radius: 20px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text);
    transition: transform .1s, background .15s, border-color .15s;
  }
  button:hover { transform: translateY(-1px); }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 600; }
  button.danger { background: var(--danger-bg); color: var(--danger); border-color: var(--danger); }
  button.tab { border-radius: 14px; }
  button.tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  button:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  /* ---- список пресетов ---- */
  .plist { display: flex; flex-direction: column; gap: 4px; max-height: 420px; overflow-y: auto; }
  .pitem {
    display: flex; align-items: center; gap: 10px; padding: 7px 10px;
    border: 1px solid transparent; border-radius: 10px; cursor: pointer; text-align: left;
    width: 100%; background: none;
  }
  .pitem:hover { background: var(--tint); }
  .pitem.sel { background: var(--active); border-color: var(--ink); }
  .pitem .nm { font-weight: 600; font-size: 13px; flex: 1; }
  .pitem .meta { font-size: 10px; color: var(--text-3); white-space: nowrap; }
  .pitem.dirty .nm::after { content: ' •'; color: var(--danger); }

  /* ---- сетка шагов ---- */
  .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 0; }
  .beat { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .beat-cells { display: flex; gap: 3px; }
  .beat-no { font-size: 10px; font-weight: 700; color: var(--text-3); }
  .step {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); font-size: 15px; font-weight: 700; padding: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .step.filled { background: var(--active); border-color: var(--ink); color: var(--ink); }
  .step.mute { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
  .step.playing { box-shadow: 0 0 0 3px rgba(255,176,59,.75); }
  .step .pick-n { display: flex; flex-direction: column-reverse; gap: 0; font-size: 10px; line-height: 1.05; }
  .step .pick-n .bass { color: var(--accent); }

  /* ---- поповер струн ---- */
  .pop {
    position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: 0 10px 28px rgba(0,0,0,.22); padding: 7px; display: flex; gap: 5px;
  }
  .pop button { width: 32px; height: 32px; border-radius: 50%; padding: 0; font-size: 13px; font-weight: 600; }
  .pop button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .pop button.tok { color: var(--accent); border-color: var(--accent); border-style: dashed; }
  .pop button.tok.on { background: var(--accent); color: #fff; border-style: solid; }

  .hint { font-size: 11px; color: var(--text-3); }
  .warn { font-size: 12px; color: var(--danger); font-weight: 600; }
  .ok { font-size: 12px; color: var(--success); font-weight: 600; }
  .split { display: grid; grid-template-columns: 300px 1fr; gap: 16px; align-items: start; }
  @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
  code.k { background: var(--tint); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; background: var(--tint); color: var(--accent); }
  table.chk { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.chk td { padding: 3px 6px; border-bottom: 1px solid var(--border-light); }
  table.chk td:last-child { text-align: right; color: var(--text-3); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Лаборатория пресетов</h1>
  <div class="sub">
    Звук, тайминг и вся ритмическая логика взяты напрямую из STRUCHORD.html —
    что слышно здесь, то и будет в приложении.
  </div>

  <div class="split">
    <!-- ЛЕВАЯ КОЛОНКА: список -->
    <div>
      <div class="card">
        <h2>Пресеты <span class="badge" id="cnt"></span></h2>
        <div class="row" style="margin-bottom:10px">
          <button class="tab active" data-filter="all">Все</button>
          <button class="tab" data-filter="strum">♩ Бой</button>
          <button class="tab" data-filter="pick">♪ Перебор</button>
        </div>
        <div class="plist" id="plist"></div>
        <div class="row" style="margin-top:12px">
          <button id="btn-new">+ Новый</button>
          <button id="btn-dup">Дублировать</button>
          <button id="btn-del" class="danger">Удалить</button>
        </div>
      </div>
    </div>

    <!-- ПРАВАЯ КОЛОНКА: редактор -->
    <div>
      <div class="card">
        <h2>Редактор</h2>
        <div class="row">
          <label class="f">id (латиницей)
            <input type="text" id="f-id" placeholder="my-groove" />
          </label>
          <label class="f">Название
            <input type="text" id="f-name" placeholder="Мой бой" />
          </label>
        </div>
        <div class="row">
          <label class="f" style="flex:1;min-width:280px">Подсказка
            <input type="text" id="f-hint" style="width:100%" placeholder="Когда и для чего этот ритм" />
          </label>
        </div>
        <div class="row">
          <label class="f">Режим
            <select id="f-mode"><option value="strum">♩ Бой</option><option value="pick">♪ Перебор</option></select>
          </label>
          <label class="f">base — долей до повтора
            <select id="f-base"></select>
          </label>
          <label class="f">subdivision — нот на долю
            <select id="f-sub">
              <option value="1">1 — четверти</option>
              <option value="2">2 — восьмые</option>
              <option value="3">3 — триоли</option>
              <option value="4">4 — шестнадцатые</option>
            </select>
          </label>
        </div>
      </div>

      <div class="card">
        <h2>Рисунок</h2>
        <div class="grid" id="grid"></div>
        <div class="hint" id="grid-hint"></div>
        <div class="row" style="margin-top:12px">
          <button id="btn-play" class="primary">▶ Слушать в цикле</button>
          <button id="btn-clear">Очистить</button>
          <label class="f">Аккорд
            <select id="f-chord"></select>
          </label>
          <label class="f">Темп
            <input type="text" id="f-bpm" value="100" style="min-width:70px" />
          </label>
          <label class="f">Проверить в размере
            <select id="f-ts">
              <option>4/4</option><option>3/4</option><option>2/4</option>
              <option>5/4</option><option>6/8</option><option>9/8</option><option>12/8</option>
            </select>
          </label>
        </div>
        <div id="report" style="margin-top:12px"></div>
      </div>

      <div class="card">
        <h2>Код для STRUCHORD.html</h2>
        <div class="hint" style="margin-bottom:8px">
          Замените в файле массив <code class="k">const STRUM_PRESETS = [ … ];</code> на текст ниже.
        </div>
        <textarea id="out" rows="14" readonly></textarea>
        <div class="row" style="margin-top:10px">
          <button id="btn-copy" class="primary">Скопировать</button>
          <button id="btn-download">Скачать .js</button>
          <span class="hint" id="copy-note"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================================================================
   ДВИЖОК, ИЗВЛЕЧЁННЫЙ ИЗ STRUCHORD.html (не редактировать вручную —
   пересобирается скриптом build-preset-lab.py)
   =================================================================== */
let audioCtx = null;
const activeOscillators = new Set();
let globalTimeSig = '4/4';

/*__ENGINE__*/

function getAudioContext() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { return null; }
  }
  return audioCtx;
}

/* ===================================================================
   ТЕКУЩИЙ НАБОР ПРЕСЕТОВ (тоже из STRUCHORD.html)
   =================================================================== */
/*__PRESETS__*/

/* ===================================================================
   ЛАБОРАТОРИЯ
   =================================================================== */
// Аппликатуры для прослушивания — берём типовые открытые формы; движку
// нужен только shape, полная библиотека аккордов здесь избыточна.
const DEMO_SHAPES = {
  Am: ['x', 0, 2, 2, 1, 0], E: [0, 2, 2, 1, 0, 0], D: ['x', 'x', 0, 2, 3, 2],
  C: ['x', 3, 2, 0, 1, 0], G: [3, 2, 0, 0, 0, 3], Em: [0, 2, 2, 0, 0, 0],
  F: [1, 3, 3, 2, 1, 1], A: ['x', 0, 2, 2, 2, 0], Dm: ['x', 'x', 0, 2, 3, 1],
};

let presets = JSON.parse(JSON.stringify(STRUM_PRESETS));
let selIdx = 0;
let filter = 'all';
let playing = false;
let playTimer = null;
let highlightTimers = [];

const $ = (id) => document.getElementById(id);

function cur() { return presets[selIdx]; }

// ---------- список ----------
function renderList() {
  const box = $('plist');
  box.innerHTML = '';
  presets.forEach((p, i) => {
    if (filter !== 'all' && p.mode !== filter) return;
    const b = document.createElement('button');
    b.className = 'pitem' + (i === selIdx ? ' sel' : '');
    b.onclick = () => { selIdx = i; stopPlay(); renderAll(); };
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = (p.mode === 'pick' ? '♪ ' : '♩ ') + (p.name || '(без имени)');
    const meta = document.createElement('span');
    meta.className = 'meta';
    meta.textContent = `${p.base}×${p.subdivision}`;
    b.append(nm, meta);
    box.appendChild(b);
  });
  $('cnt').textContent = presets.length + ' шт.';
}

// ---------- поля ----------
function renderFields() {
  const p = cur();
  if (!p) return;
  $('f-id').value = p.id || '';
  $('f-name').value = p.name || '';
  $('f-hint').value = p.hint || '';
  $('f-mode').value = p.mode;
  $('f-sub').value = String(p.subdivision);
  const baseSel = $('f-base');
  baseSel.innerHTML = '';
  for (let b = 1; b <= 12; b++) {
    const o = document.createElement('option');
    o.value = String(b);
    o.textContent = String(b);
    baseSel.appendChild(o);
  }
  baseSel.value = String(p.base);
}

// ---------- сетка ----------
function stepLabel(sym, mode) {
  if (mode === 'pick') {
    const items = normalizePickStep(sym);
    return items.length ? items.slice().sort((a, b) => pickStepSortValue(b) - pickStepSortValue(a)) : null;
  }
  return sym || null;
}

function renderGrid() {
  const p = cur();
  const g = $('grid');
  g.innerHTML = '';
  if (!p) return;
  const sub = p.subdivision;
  for (let beat = 0; beat < p.base; beat++) {
    const bd = document.createElement('div');
    bd.className = 'beat';
    const cells = document.createElement('div');
    cells.className = 'beat-cells';
    for (let s = 0; s < sub; s++) {
      const idx = beat * sub + s;
      const btn = document.createElement('button');
      btn.className = 'step';
      btn.dataset.i = String(idx);
      paintStep(btn, p.steps[idx], p.mode);
      // Маятник — как в приложении: нечётные ячейки начинают с ↓, чётные с ↑
      // Та же логика, что в приложении: при двоичном делении рука
      // чередуется по сквозному номеру, при триольном (sub 3) — вниз,
      // вниз, вверх внутри доли.
      const even = sub % 3 === 0 ? s % 3 === 2 : idx % 2 === 1;
      btn.title = even ? '↑ → ↓ → × → пусто' : '↓ → × → ↑ → пусто';
      btn.onclick = (e) => {
        e.stopPropagation();
        if (p.mode === 'pick') openPick(btn, idx);
        else {
          const cycle = even ? ['U', 'D', 'X', null] : ['D', 'X', 'U', null];
          const at = cycle.indexOf(p.steps[idx] ?? null);
          p.steps[idx] = cycle[(at + 1) % cycle.length];
          paintStep(btn, p.steps[idx], p.mode);
          onEdit();
        }
      };
      cells.appendChild(btn);
    }
    const no = document.createElement('span');
    no.className = 'beat-no';
    no.textContent = String(beat + 1);
    bd.append(cells, no);
    g.appendChild(bd);
  }
  $('grid-hint').textContent = p.mode === 'pick'
    ? 'Клик — выбрать струны. Б — бас аккорда (подставляется на лету), Б₂ — альтернирующий бас.'
    : 'Клик — цикл знаков. Порядок зависит от чётности ячейки (принцип маятника).';
}

function paintStep(btn, sym, mode) {
  btn.className = 'step';
  btn.innerHTML = '';
  const v = stepLabel(sym, mode);
  if (!v) return;
  btn.classList.add('filled');
  if (mode === 'pick') {
    const box = document.createElement('span');
    box.className = 'pick-n';
    v.forEach((n) => {
      const s = document.createElement('span');
      if (isPickBassToken(n)) s.className = 'bass';
      s.textContent = pickTokenLabel(n);
      box.appendChild(s);
    });
    btn.appendChild(box);
  } else {
    if (v === 'X') btn.classList.add('mute');
    btn.textContent = v === 'D' ? '↓' : v === 'U' ? '↑' : '×';
  }
}

function openPick(anchor, idx) {
  document.querySelectorAll('.pop').forEach((e) => e.remove());
  const p = cur();
  const pop = document.createElement('div');
  pop.className = 'pop';
  const cur1 = normalizePickStep(p.steps[idx]);
  const opts = [
    { v: PICK_BASS_TOKEN, tok: true }, { v: PICK_ALT_BASS_TOKEN, tok: true },
    { v: 6 }, { v: 5 }, { v: 4 }, { v: 3 }, { v: 2 }, { v: 1 },
  ];
  opts.forEach((o) => {
    const b = document.createElement('button');
    b.textContent = pickTokenLabel(o.v);
    b.className = (o.tok ? 'tok ' : '') + (cur1.includes(o.v) ? 'on' : '');
    b.onclick = (e) => {
      e.stopPropagation();
      const at = cur1.indexOf(o.v);
      if (at >= 0) cur1.splice(at, 1); else cur1.push(o.v);
      p.steps[idx] = cur1.length ? cur1.slice().sort((a, c) => pickStepSortValue(a) - pickStepSortValue(c)) : null;
      b.classList.toggle('on');
      paintStep(anchor, p.steps[idx], p.mode);
      onEdit();
    };
    pop.appendChild(b);
  });
  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  const wdt = opts.length * 37;
  pop.style.left = Math.max(8, Math.min(r.left + r.width / 2 - wdt / 2, innerWidth - wdt - 8)) + 'px';
  pop.style.top = (r.bottom + 6) + 'px';
  setTimeout(() => document.addEventListener('click', function off(e) {
    if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener('click', off, true); }
  }, true), 0);
}

// ---------- проверка ----------
function renderReport() {
  const p = cur();
  const box = $('report');
  box.innerHTML = '';
  if (!p) return;
  const problems = [];
  const need = p.base * p.subdivision;
  if (p.steps.length !== need) problems.push(`длина steps = ${p.steps.length}, а base×subdivision = ${need}`);
  if (!/^[a-z0-9-]+$/.test(p.id || '')) problems.push('id должен быть латиницей, цифрами и дефисами');
  const dup = presets.filter((x) => x.id === p.id).length;
  if (dup > 1) problems.push(`id «${p.id}» уже занят другим пресетом`);
  if (!p.steps.some((s) => (Array.isArray(s) ? s.length : s))) problems.push('нет ни одного удара');

  const t = document.createElement('table');
  t.className = 'chk';
  const ts = $('f-ts').value;
  const gridUnits = getGridUnitsPerBar(ts);
  const fits = isPresetCompatible(p, ts, gridUnits);
  const rows = [];
  if (fits) {
    const built = buildPatternFromPreset(p, gridUnits, $('f-chord').value, 'C');
    const hits = built.steps.filter((s) => (Array.isArray(s) ? s.length : s)).length;
    const { denominator } = parseTimeSig(ts);
    const noteNames = { 1: 'целые', 2: 'половинные', 3: 'триольные', 4: 'четверти', 6: 'секстоли', 8: 'восьмые', 12: 'триоли восьмых', 16: 'шестнадцатые' };
    rows.push(['В размере ' + ts, `помещается ×${gridUnits / p.base}`]);
    rows.push(['Ударов за такт', String(hits)]);
    rows.push(['Длительность нот', noteNames[denominator * p.subdivision] || ('1/' + denominator * p.subdivision)]);
    if (p.mode === 'pick') {
      const shape = DEMO_SHAPES[$('f-chord').value];
      const played = built.steps.map((s) => (s ? resolvePickStepStrings(s, shape, $('f-chord').value).join('+') : '·')).join(' ');
      rows.push(['Струны на ' + $('f-chord').value, played]);
    }
  } else {
    // Объясняем ПРИЧИНУ, а не просто «скрыт»: пользователь должен
    // понимать, дело в делимости или в группировке составного размера.
    const reason = gridUnits % p.base !== 0
      ? `${gridUnits} долей не делится на base=${p.base} — рисунок оборвётся`
      : `составной размер группируется по 3, а base=${p.base} этого не уважает`;
    rows.push(['В размере ' + ts, 'скрыт: ' + reason]);
  }
  rows.forEach(([a, b]) => {
    const tr = t.insertRow();
    tr.insertCell().textContent = a;
    tr.insertCell().textContent = b;
  });
  box.appendChild(t);
  const st = document.createElement('div');
  st.style.marginTop = '8px';
  if (problems.length) {
    st.className = 'warn';
    st.textContent = '⚠ ' + problems.join('; ');
  } else {
    st.className = 'ok';
    st.textContent = '✓ пресет корректен';
  }
  box.appendChild(st);
}

// ---------- воспроизведение ----------
function stopPlay() {
  playing = false;
  if (playTimer) { clearTimeout(playTimer); playTimer = null; }
  highlightTimers.forEach(clearTimeout);
  highlightTimers = [];
  document.querySelectorAll('.step.playing').forEach((e) => e.classList.remove('playing'));
  $('btn-play').textContent = '▶ Слушать в цикле';
}

function startPlay() {
  const ctx = getAudioContext();
  if (!ctx) return alert('Web Audio недоступен');
  if (ctx.state === 'suspended') ctx.resume();
  const p = cur();
  if (!p.steps.some((s) => (Array.isArray(s) ? s.length : s))) return;
  playing = true;
  $('btn-play').textContent = '■ Стоп';

  const chord = $('f-chord').value;
  const shape = DEMO_SHAPES[chord];
  const bpm = Math.max(30, Math.min(300, parseInt($('f-bpm').value, 10) || 100));
  const ts = $('f-ts').value;
  const stepSec = getGridUnitDurationSeconds(bpm, ts) / p.subdivision;

  const loop = () => {
    if (!playing) return;
    const t0 = ctx.currentTime + 0.06;
    p.steps.forEach((sym, i) => {
      const t = t0 + i * stepSec;
      if (p.mode === 'pick') {
        resolvePickStepStrings(sym, shape, chord).forEach((n) => {
          pluckSingleGuitarString(ctx, shape, chord, 'C', n, t, 1.7, 0.42);
        });
      } else if (sym === 'X') {
        strumMute(ctx, shape, chord, 'C', t, 0.4);
      } else if (sym === 'D' || sym === 'U') {
        strumChordDirectional(ctx, shape, chord, 'C', t, 1.4, 0.34, sym === 'U' ? 'up' : 'down');
      }
      // подсветка текущего шага
      const el = document.querySelector(`.step[data-i="${i}"]`);
      if (el) {
        const on = setTimeout(() => {
          el.classList.add('playing');
          const off = setTimeout(() => el.classList.remove('playing'), Math.max(70, stepSec * 700));
          highlightTimers.push(off);
        }, Math.max(0, (t - ctx.currentTime) * 1000));
        highlightTimers.push(on);
      }
    });
    playTimer = setTimeout(loop, Math.max(150, p.steps.length * stepSec * 1000));
  };
  loop();
}

// ---------- генерация кода ----------
function esc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }

function stepsToCode(p) {
  return '[' + p.steps.map((s) => {
    if (s === null || s === undefined) return 'null';
    if (Array.isArray(s)) return '[' + s.map((x) => (typeof x === 'string' ? `'${x}'` : x)).join(', ') + ']';
    return `'${s}'`;
  }).join(', ') + ']';
}

function renderCode() {
  const lines = ['const STRUM_PRESETS = ['];
  presets.forEach((p) => {
    lines.push('  {');
    lines.push(`    id: '${esc(p.id)}',`);
    lines.push(`    name: '${esc(p.name)}',`);
    lines.push(`    hint: '${esc(p.hint)}',`);
    lines.push(`    mode: '${p.mode}',`);
    lines.push(`    base: ${p.base},`);
    lines.push(`    subdivision: ${p.subdivision},`);
    lines.push(`    steps: ${stepsToCode(p)},`);
    lines.push('  },');
  });
  lines.push('];');
  $('out').value = lines.join('\n');
}

function onEdit() { renderReport(); renderCode(); }

function renderAll() { renderList(); renderFields(); renderGrid(); renderReport(); renderCode(); }

// ---------- события ----------
document.querySelectorAll('[data-filter]').forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll('[data-filter]').forEach((x) => x.classList.remove('active'));
    b.classList.add('active');
    filter = b.dataset.filter;
    renderList();
  };
});

['f-id', 'f-name', 'f-hint'].forEach((id) => {
  $(id).oninput = () => {
    const p = cur();
    p[id.slice(2)] = $(id).value;
    renderList();
    onEdit();
  };
});

$('f-mode').onchange = () => {
  const p = cur();
  p.mode = $('f-mode').value;
  p.steps = p.steps.map(() => null); // семантика ячеек разная
  stopPlay(); renderAll();
};

$('f-base').onchange = () => {
  const p = cur();
  const nb = parseInt($('f-base').value, 10);
  const old = p.steps.slice();
  p.base = nb;
  const need = nb * p.subdivision;
  // Удлиняем повтором рисунка, укорачиваем — обрезаем: так правка base
  // не стирает уже набранное.
  p.steps = Array.from({ length: need }, (_, i) => (old.length ? old[i % old.length] ?? null : null));
  stopPlay(); renderGrid(); onEdit();
};

$('f-sub').onchange = () => {
  const p = cur();
  const ns = parseInt($('f-sub').value, 10);
  // Тот же пересчёт по времени, что и в приложении.
  const r = resamplePatternSteps(p.steps, p.subdivision, ns, p.base * ns);
  p.subdivision = ns;
  p.steps = r.steps;
  stopPlay(); renderGrid(); onEdit();
  if (r.lost) $('grid-hint').textContent = `⚠ ${r.lost} удар(ов) не поместились в новую сетку`;
};

$('f-ts').onchange = onEdit;
$('f-chord').onchange = onEdit;
$('f-bpm').oninput = () => { if (playing) { stopPlay(); startPlay(); } };

$('btn-play').onclick = () => (playing ? stopPlay() : startPlay());
$('btn-clear').onclick = () => { cur().steps = cur().steps.map(() => null); renderGrid(); onEdit(); };

$('btn-new').onclick = () => {
  presets.push({
    id: 'new-' + Date.now().toString(36).slice(-4), name: 'Новый ритм', hint: '',
    mode: 'strum', base: 4, subdivision: 2,
    steps: new Array(8).fill(null),
  });
  selIdx = presets.length - 1;
  stopPlay(); renderAll();
};
$('btn-dup').onclick = () => {
  const c = JSON.parse(JSON.stringify(cur()));
  c.id = c.id + '-copy';
  c.name = c.name + ' (копия)';
  presets.splice(selIdx + 1, 0, c);
  selIdx++;
  stopPlay(); renderAll();
};
$('btn-del').onclick = () => {
  if (presets.length <= 1) return;
  if (!confirm(`Удалить пресет «${cur().name}»?`)) return;
  presets.splice(selIdx, 1);
  selIdx = Math.max(0, selIdx - 1);
  stopPlay(); renderAll();
};

$('btn-copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText($('out').value);
    $('copy-note').textContent = 'скопировано ✓';
  } catch (e) {
    $('out').select();
    $('copy-note').textContent = 'выделено — нажмите Ctrl+C';
  }
  setTimeout(() => ($('copy-note').textContent = ''), 2500);
};
$('btn-download').onclick = () => {
  const blob = new Blob([$('out').value], { type: 'text/javascript' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'strum-presets.js';
  a.click();
  URL.revokeObjectURL(a.href);
};

// аккорды для прослушивания
Object.keys(DEMO_SHAPES).forEach((c) => {
  const o = document.createElement('option');
  o.value = c; o.textContent = c;
  $('f-chord').appendChild(o);
});
$('f-chord').value = 'Am';

renderAll();
</script>
</body>
</html>
