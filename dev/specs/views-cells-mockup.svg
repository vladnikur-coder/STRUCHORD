<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="880" fill="#f4f1ec"/>
  <text x="40" y="44" font-size="23" font-weight="700" fill="#2b2b2b">Два вопроса этапа «Виды» — картинками</text>

  <!-- Панель A: ячейка != такт -->
  <rect x="40" y="66" width="1160" height="380" rx="12" fill="#fff" stroke="#ddd6cc"/>
  <text x="64" y="98" font-size="17" font-weight="700" fill="#2b2b2b">А. Ячейка не равна такту: ячейка Am на 6 восьмых через черту такта</text>
  <text x="64" y="126" font-size="14" fill="#6b675f">В Редакторе ячейку можно растянуть как угодно. В табах такты — настоящие (4/4). Как показать такую ячейку?</text>

  <text x="64" y="160" font-size="14" font-weight="700" fill="#8a8578">РЕДАКТОР</text>
  <rect x="64" y="170" width="1080" height="46" rx="6" fill="#f0e7d8" stroke="#ddd3c2"/>
  <rect x="244" y="170" width="540" height="46" fill="#f5e3cd" stroke="#e8762d" stroke-width="2"/>
  <text x="264" y="199" font-size="15" font-weight="700" fill="#2b2b2b">Am · ячейка на 6 восьмых</text>
  <rect x="784" y="170" width="360" height="46" rx="6" fill="#f0e7d8" stroke="#ddd3c2"/>
  <text x="804" y="199" font-size="15" fill="#555">G …</text>
  <g stroke="#c9c2b4"><line x1="424" y1="170" x2="424" y2="216"/><line x1="604" y1="170" x2="604" y2="216"/></g>

  <text x="64" y="252" font-size="14" font-weight="700" fill="#8a8578">ТАБЫ (вариант 1 — предлагаю)</text>
  <g stroke="#b9b2a4" stroke-width="1.4">
    <line x1="64" y1="286" x2="1144" y2="286"/><line x1="64" y1="296" x2="1144" y2="296"/><line x1="64" y1="306" x2="1144" y2="306"/>
    <line x1="64" y1="316" x2="1144" y2="316"/><line x1="64" y1="326" x2="1144" y2="326"/><line x1="64" y1="336" x2="1144" y2="336"/>
  </g>
  <line x1="424" y1="262" x2="424" y2="344" stroke="#2b2b2b" stroke-width="2.4"/>
  <text x="398" y="360" font-size="13" fill="#555">такт 1</text><text x="740" y="360" font-size="13" fill="#555">такт 2</text>
  
  <text x="180" y="278" font-size="14" font-weight="700" fill="#c25e1e">Am ← подпись аккорда там, где началась ячейка (середина такта — можно)</text>
  <g font-size="13" fill="#2b2b2b" font-weight="700">
    <text x="252" y="310">0</text><text x="330" y="300">1</text><text x="408" y="310">2</text><text x="486" y="300">1</text><text x="564" y="310">0</text><text x="642" y="320">2</text>
  </g>
  <text x="64" y="392" font-size="14" fill="#6b675f">Тактовые черты — настоящие такты; границу ячейки не рисуем вовсе — только подпись аккорда в месте смены ячейки (решение владельца).</text>
  <text x="64" y="418" font-size="14" fill="#6b675f">Вариант 2: черта на каждой границе ячейки (как квадраты в Редакторе) — но тогда «такты» в табах перестают быть настоящими тактами.</text>

  <!-- Панель B: когда ноты записываются в файл -->
  <rect x="40" y="466" width="1160" height="380" rx="12" fill="#fff" stroke="#ddd6cc"/>
  <text x="64" y="498" font-size="17" font-weight="700" fill="#2b2b2b">Б. Police: в файле только аккорды и бой. Когда ноты становятся «настоящими»?</text>

  <rect x="64" y="522" width="320" height="180" rx="8" fill="#faf8f4" stroke="#ddd6cc"/>
  <text x="84" y="550" font-size="15" font-weight="700" fill="#2b2b2b">1. Файл как есть</text>
  <text x="84" y="578" font-size="14" fill="#555">аккорды + аппликатуры + бой,</text>
  <text x="84" y="600" font-size="14" fill="#555">нот нет (так было всегда)</text>
  <text x="84" y="632" font-size="14" fill="#555">Редактор и звук — как сейчас</text>

  <path d="M392 612 L452 612 M444 604 L454 612 L444 620" stroke="#e8762d" stroke-width="2.4" fill="none"/>
  <text x="386" y="596" font-size="13" fill="#c25e1e">открыли Партии</text>

  <rect x="462" y="522" width="330" height="180" rx="8" fill="#fff4ea" stroke="#e8762d"/>
  <text x="482" y="550" font-size="15" font-weight="700" fill="#c25e1e">2. Ноты построены в памяти</text>
  <text x="482" y="578" font-size="14" fill="#555">Партии показывают табы из аккордов</text>
  <text x="482" y="600" font-size="14" fill="#555">и боя. Файл НЕ изменился,</text>
  <text x="482" y="622" font-size="14" fill="#555">undo не добавилось</text>
  <text x="482" y="654" font-size="14" fill="#555">переключение режимов — бесплатно</text>

  <path d="M800 612 L860 612 M852 604 L862 612 L852 620" stroke="#e8762d" stroke-width="2.4" fill="none"/>
  <text x="782" y="596" font-size="13" fill="#c25e1e">первая правка ноты</text>

  <rect x="870" y="522" width="306" height="180" rx="8" fill="#eef6ee" stroke="#7fae7f"/>
  <text x="890" y="550" font-size="15" font-weight="700" fill="#3d7a3d">3. Ноты записаны в дорожку</text>
  <text x="890" y="578" font-size="14" fill="#555">одним шагом undo вместе</text>
  <text x="890" y="600" font-size="14" fill="#555">с правкой. Дальше основа — ноты:</text>
  <text x="890" y="622" font-size="14" fill="#555">аккорд и бой в Редакторе</text>
  <text x="890" y="644" font-size="14" fill="#555">выводятся из них</text>

  <text x="64" y="742" font-size="14" fill="#6b675f">Вариант (а) — как на картинке: записываем при первой правке. Вариант (б): записываем сразу при первом открытии Партий</text>
  <text x="64" y="766" font-size="14" fill="#6b675f">(файл меняется от просмотра). Вариант (в): не записываем никогда — правка ноты в Партиях переписывает аккорд и бой</text>
  <text x="64" y="790" font-size="14" fill="#6b675f">в Редакторе (основа — аккорды, гипотеза «ноты — основа» отклоняется).</text>
  <text x="64" y="824" font-size="14" fill="#6b675f">Честные потери цикла при основе-нотах: свинг кастомного боя, направление удара одним моментом, номера пальцев.</text>
</svg>
