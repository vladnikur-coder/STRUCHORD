<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="520" fill="#f7f3ec"/>
  <text x="30" y="42" font-size="22" font-weight="700" fill="#33302b">Растяжение ячейки с ручными нотами: что происходит с нотами?</text>
  <text x="30" y="68" font-size="14" fill="#6b655a">Ячейка была на 1 такт, её растянули на 2. Аккорд просто занимает место дольше. А ноты, введённые вручную?</text>

  <!-- Было -->
  <g>
    <text x="30" y="112" font-size="15" font-weight="700" fill="#33302b">Было (1 такт)</text>
    <rect x="30" y="124" width="300" height="86" rx="8" fill="#ffffff" stroke="#c9c0ae"/>
    <g stroke="#d8d2c4"><line x1="44" y1="142" x2="316" y2="142"/><line x1="44" y1="156" x2="316" y2="156"/><line x1="44" y1="170" x2="316" y2="170"/><line x1="44" y1="184" x2="316" y2="184"/><line x1="44" y1="198" x2="316" y2="198"/></g>
    <g font-size="14" font-weight="700" fill="#b3543f">
      <text x="70" y="146">5</text><text x="118" y="160">7</text><text x="166" y="146">9</text><text x="214" y="160">7</text><text x="262" y="146">5</text>
    </g>
    <text x="30" y="232" font-size="12.5" fill="#6b655a">ручные ноты занимают весь такт</text>
  </g>

  <!-- Вариант A -->
  <g>
    <text x="30" y="282" font-size="15" font-weight="700" fill="#2e6b34">Вариант A — оставить как есть</text>
    <rect x="30" y="294" width="440" height="86" rx="8" fill="#ffffff" stroke="#c9c0ae"/>
    <line x1="250" y1="294" x2="250" y2="380" stroke="#c9c0ae" stroke-dasharray="4 4"/>
    <g stroke="#d8d2c4"><line x1="44" y1="312" x2="456" y2="312"/><line x1="44" y1="326" x2="456" y2="326"/><line x1="44" y1="340" x2="456" y2="340"/><line x1="44" y1="354" x2="456" y2="354"/><line x1="44" y1="368" x2="456" y2="368"/></g>
    <g font-size="14" font-weight="700" fill="#b3543f">
      <text x="70" y="316">5</text><text x="118" y="330">7</text><text x="166" y="316">9</text><text x="214" y="330">7</text>
    </g>
    <text x="286" y="342" font-size="13" fill="#9a927f">пусто</text>
    <text x="30" y="404" font-size="12.5" fill="#6b655a">ноты не двигаются; второй такт молчит. Ничего не выдумываем от себя.</text>
  </g>

  <!-- Вариант B -->
  <g>
    <text x="510" y="282" font-size="15" font-weight="700" fill="#2e6b34">Вариант B — повторить по кругу</text>
    <rect x="510" y="294" width="440" height="86" rx="8" fill="#ffffff" stroke="#c9c0ae"/>
    <line x1="730" y1="294" x2="730" y2="380" stroke="#c9c0ae" stroke-dasharray="4 4"/>
    <g stroke="#d8d2c4"><line x1="524" y1="312" x2="936" y2="312"/><line x1="524" y1="326" x2="936" y2="326"/><line x1="524" y1="340" x2="936" y2="340"/><line x1="524" y1="354" x2="936" y2="354"/><line x1="524" y1="368" x2="936" y2="368"/></g>
    <g font-size="14" font-weight="700" fill="#b3543f">
      <text x="550" y="316">5</text><text x="598" y="330">7</text><text x="646" y="316">9</text><text x="694" y="330">7</text>
    </g>
    <g font-size="14" font-weight="700" fill="#b3543f" opacity="0.45">
      <text x="770" y="316">5</text><text x="818" y="330">7</text><text x="866" y="316">9</text><text x="914" y="330">7</text>
    </g>
    <text x="510" y="404" font-size="12.5" fill="#6b655a">рисунок повторяется, как повторяется бой аккорда. Ноты «размножаются» сами.</text>
  </g>

  <text x="30" y="452" font-size="13" fill="#6b655a">Как с аккордом: при растяжении бой зацикливается — вариант B ближе к аккорду.</text>
  <text x="30" y="476" font-size="13" fill="#6b655a">Но ручные ноты — не бой: мелодия при повторе может прозвучать неожиданно — вариант A ничего не придумывает.</text>
  <text x="30" y="500" font-size="13" font-weight="700" fill="#33302b">Для ячеек без ручных нот разницы нет: там ноты каждый раз вычисляются из аккорда и боя.</text>
</svg>
