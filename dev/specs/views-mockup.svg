<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="1240" height="780" fill="#f4f1ec"/>
  <text x="40" y="46" font-size="24" font-weight="700" fill="#2b2b2b">Этап «Виды»: один экран песни — три вида</text>
  <text x="40" y="74" font-size="15" fill="#6b675f">Вместо отдельных экранов «Редактор / Лента / Партии» — один переключатель. Место (такт) при смене вида не теряется.</text>

  <!-- Окно приложения -->
  <rect x="40" y="100" width="1160" height="470" rx="14" fill="#ffffff" stroke="#ddd6cc"/>
  <!-- Шапка -->
  <rect x="40" y="100" width="1160" height="58" rx="14" fill="#faf8f4"/>
  <circle cx="76" cy="129" r="13" fill="#fff" stroke="#d8d2c8"/><path d="M72 121 L86 129 L72 137 Z" fill="#444"/>
  <text x="104" y="135" font-size="14" fill="#555">транспорт · undo · сохранение · тональность · темп · размер · строй — общие</text>
  <!-- Переключатель вида -->
  <rect x="836" y="112" width="348" height="34" rx="17" fill="#efe9df" stroke="#ddd3c2"/>
  <rect x="1052" y="112" width="132" height="34" rx="17" fill="#e8762d"/>
  <text x="880" y="134" font-size="15" fill="#555">Аккорды</text>
  <text x="972" y="134" font-size="15" fill="#555">Лента</text>
  <text x="1092" y="134" font-size="15" font-weight="700" fill="#ffffff">Табы</text>

  <!-- Область вида: табы -->
  <text x="64" y="188" font-size="14" font-weight="700" fill="#8a8578">ВИД «ТАБЫ» (сейчас выбран)</text>

  <!-- Серая дорожка -->
  <rect x="64" y="200" width="1112" height="104" rx="8" fill="#f3f1ec" stroke="#cfc9bd" stroke-dasharray="5 4"/>
  <text x="80" y="224" font-size="14" font-weight="700" fill="#8a8578">Дорожка «Аккорды»: такт «по аккордам» — ноты из аккорда и боя, серые; следует за Редактором</text>
  <g stroke="#b9b2a4" stroke-width="1.4">
    <line x1="80" y1="242" x2="1160" y2="242"/><line x1="80" y1="252" x2="1160" y2="252"/><line x1="80" y1="262" x2="1160" y2="262"/>
    <line x1="80" y1="272" x2="1160" y2="272"/><line x1="80" y1="282" x2="1160" y2="282"/><line x1="80" y1="292" x2="1160" y2="292"/>
  </g>
  <g font-size="13" fill="#8a8578" font-weight="700">
    <text x="120" y="246">5</text><text x="150" y="256">7</text><text x="180" y="266">9</text><text x="210" y="276">6</text>
    <text x="330" y="246">2</text><text x="360" y="256">4</text><text x="390" y="266">6</text><text x="420" y="276">2</text>
    <text x="560" y="252">x</text><text x="590" y="262">x</text><text x="620" y="272">x</text>
  </g>
  <text x="548" y="232" font-size="13" fill="#8a8578">✕ глушение</text>
  <path d="M760 236 L760 268 M752 244 L760 234 L768 244" stroke="#8a8578" stroke-width="2" fill="none"/>
  <text x="726" y="292" font-size="13" fill="#8a8578">Brush ↑ бой вверх</text>
  <path d="M980 268 L980 236 M972 244 L980 234 L988 244" stroke="#8a8578" stroke-width="2" fill="none" transform="rotate(180 980 252)"/>
  <text x="946" y="292" font-size="13" fill="#8a8578">Brush ↓ бой вниз</text>
  <g stroke="#d8d2c8"><line x1="300" y1="238" x2="300" y2="296"/><line x1="520" y1="238" x2="520" y2="296"/><line x1="730" y1="238" x2="730" y2="296"/><line x1="950" y1="238" x2="950" y2="296"/></g>

  <!-- Обычная дорожка -->
  <rect x="64" y="318" width="1112" height="86" rx="8" fill="#ffffff" stroke="#ddd6cc"/>
  <text x="80" y="340" font-size="14" font-weight="700" fill="#2b2b2b">Гитара — обычная партия (редактируется, как сейчас)</text>
  <g stroke="#c9c2b4" stroke-width="1.4">
    <line x1="80" y1="356" x2="1160" y2="356"/><line x1="80" y1="365" x2="1160" y2="365"/><line x1="80" y1="374" x2="1160" y2="374"/>
    <line x1="80" y1="383" x2="1160" y2="383"/><line x1="80" y1="392" x2="1160" y2="392"/>
  </g>
  <g font-size="13" fill="#2b2b2b" font-weight="700"><text x="200" y="378">3</text><text x="260" y="369">5</text><text x="470" y="378">7</text></g>

  <!-- Курсор такта 5 -->
  <rect x="512" y="196" width="212" height="212" fill="#e8762d" opacity="0.10"/>
  <rect x="512" y="196" width="212" height="212" fill="none" stroke="#e8762d" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="528" y="424" font-size="13" font-weight="700" fill="#c25e1e">курсор: такт 5 — общий для всех видов</text>

  <!-- Значок ручного такта -->
  <rect x="730" y="416" width="446" height="38" rx="8" fill="#fff4ea" stroke="#e8762d"/>
  <text x="750" y="440" font-size="14" font-weight="700" fill="#c25e1e">✎ поправили ноту → такт стал «по нотам»: бой в нём молчит, звучат ноты</text>

  <!-- Global View -->
  <rect x="40" y="586" width="1160" height="118" rx="12" fill="#ffffff" stroke="#ddd6cc"/>
  <text x="64" y="612" font-size="14" font-weight="700" fill="#2b2b2b">Global View — общая полоса внизу во всех видах (спрятать: F8)</text>
  <g font-size="13">
    <rect x="64" y="624" width="150" height="20" fill="#f0e7d8" stroke="#ddd3c2"/><text x="72" y="639" fill="#555">♪ Песня (аккорды)</text>
    <rect x="64" y="648" width="150" height="20" fill="#fdeee0" stroke="#eec39a"/><text x="72" y="663" fill="#555">Гитара</text>
    <rect x="64" y="672" width="150" height="20" fill="#e8f0fe" stroke="#b9cdf5"/><text x="72" y="687" fill="#555">Мастер</text>
  </g>
  <g>
    <rect x="222" y="624" width="118" height="20" fill="#f0e7d8" stroke="#ddd3c2"/><rect x="344" y="624" width="118" height="20" fill="#f0e7d8" stroke="#ddd3c2"/>
    <rect x="466" y="624" width="118" height="20" fill="#f5e3cd" stroke="#eec39a"/><rect x="588" y="624" width="118" height="20" fill="#f5e3cd" stroke="#eec39a"/>
    <rect x="222" y="648" width="118" height="20" fill="#fff" stroke="#e3ded4"/><rect x="466" y="648" width="118" height="20" fill="#fdeee0" stroke="#eec39a"/>
    <rect x="222" y="672" width="484" height="20" fill="#7aa5e8"/><text x="234" y="687" font-size="13" fill="#fff" font-weight="700">Куплет</text>
  </g>
  <text x="730" y="652" font-size="13" fill="#6b675f">клик по такту — переход на этот такт в любом виде</text>
  <text x="730" y="674" font-size="13" fill="#6b675f">был в 5-м такте в «Аккордах» → «Табы» откроются на 5-м такте</text>

  <text x="40" y="742" font-size="14" fill="#6b675f">У каждого такта один источник правды: «по аккордам» (считается на лету, как сейчас звук) или «по нотам» (хранится). Копий и конвертаций нет.</text>
</svg>
